<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Scale Visualizer</title>


<style>

/* =====================================================
   GENERAL
   ===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #f5f5f5;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow-x: hidden;
}

button,
select {
    font-family: inherit;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
    text-align: center;
    padding: 28px 20px 12px;
}

h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
}

.subtitle {
    margin-top: 5px;
    color: #888;
    font-size: 14px;
}


/* =====================================================
   CONTROLS
   ===================================================== */

.controls {
    display: flex;
    gap: 10px;

    padding: 18px 16px;

    width: 100%;
    max-width: 650px;

    margin: auto;
}

.root-select {
    width: 95px;

    appearance: none;
    -webkit-appearance: none;

    background: #222;
    color: white;

    border: 1px solid #444;
    border-radius: 12px;

    padding: 13px 14px;

    font-size: 16px;

    cursor: pointer;
}


/* =====================================================
   SCALE MENU
   ===================================================== */

.scale-menu-wrapper {
    position: relative;
    flex: 1;
}

.scale-menu-button {

    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #222;
    color: white;

    border: 1px solid #444;
    border-radius: 12px;

    padding: 13px 14px;

    font-size: 16px;

    cursor: pointer;

    text-align: left;
}

.scale-menu-arrow {
    color: #888;
    font-size: 14px;

    transition:
        transform 0.2s ease;
}

.scale-menu-button.open .scale-menu-arrow {
    transform: rotate(180deg);
}


/* =====================================================
   SCALE MENU PANEL
   ===================================================== */

.scale-menu {

    position: absolute;

    top: calc(100% + 8px);
    left: 0;
    right: 0;

    background: #1c1c1c;

    border: 1px solid #444;

    border-radius: 14px;

    overflow: hidden;

    z-index: 100;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.45);

    display: none;
}

.scale-menu.open {
    display: block;
}


/* =====================================================
   CATEGORY
   ===================================================== */

.scale-category {
    border-bottom: 1px solid #303030;
}

.scale-category:last-child {
    border-bottom: none;
}

.category-button {

    width: 100%;

    border: none;

    background: transparent;

    color: #aaa;

    padding: 15px 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 14px;

    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    cursor: pointer;

    text-align: left;
}

.category-button:active {
    background: #252525;
}

.category-arrow {
    color: #666;

    transition:
        transform 0.2s ease;
}

.scale-category.expanded
.category-arrow {
    transform: rotate(90deg);
}


/* =====================================================
   SCALE OPTIONS
   ===================================================== */

.category-options {
    display: none;

    padding: 0 8px 8px;
}

.scale-category.expanded
.category-options {
    display: block;
}

.scale-option {

    width: 100%;

    border: none;

    background: transparent;

    color: #eee;

    padding: 11px 12px;

    border-radius: 9px;

    font-size: 15px;

    text-align: left;

    cursor: pointer;
}

.scale-option:hover {
    background: #292929;
}

.scale-option.selected {
    background: #eee;
    color: #111;
}


/* =====================================================
   DISPLAY MODE
   ===================================================== */

.display-section {
    text-align: center;
    margin: 0 auto 15px;
}

.display-label {

    color: #777;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

.display-buttons {

    display: inline-flex;

    background: #222;

    border: 1px solid #444;

    border-radius: 12px;

    padding: 3px;
}

.display-button {

    border: none;

    background: transparent;

    color: #888;

    padding: 8px 13px;

    border-radius: 9px;

    font-size: 14px;

    cursor: pointer;
}

.display-button.active {

    background: #eee;

    color: #111;
}


/* =====================================================
   SCALE INFORMATION
   ===================================================== */

.scale-info {

    text-align: center;

    padding: 5px 20px 18px;
}

.scale-name {

    font-size: 23px;

    font-weight: 600;
}

.notes {

    margin-top: 8px;

    color: #999;

    font-size: 16px;

    letter-spacing: 1px;

    line-height: 1.5;
}


/* =====================================================
   POSITION NAVIGATION
   ===================================================== */

.position-header {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;

    margin-bottom: 12px;
}

.position-button {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 1px solid #444;

    background: #222;

    color: white;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.position-button:active {

    background: #333;

    transform: scale(0.95);
}

.position-title {

    text-align: center;

    min-width: 130px;
}

.position-number {

    font-size: 17px;

    font-weight: 600;
}

.position-frets {

    margin-top: 3px;

    font-size: 12px;

    color: #777;
}

.position-dots {

    display: flex;

    justify-content: center;

    gap: 7px;

    margin-top: 7px;
}

.position-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #444;
}

.position-dot.active {

    background: #eee;
}


/* =====================================================
   FRETBOARD
   ===================================================== */

.fretboard-wrapper {

    width: 100%;

    padding: 0 10px 25px;

    touch-action: pan-y;
}

.fretboard {

    width: 100%;

    border-radius: 10px;

    overflow: hidden;

    border: 2px solid #444;

    background: #8b5a2b;
}

.string {

    display: grid;

    grid-template-columns:
        38px
        repeat(5, 1fr);

    height: 62px;

    border-bottom:
        1px solid rgba(255,255,255,0.28);
}

.string:last-child {
    border-bottom: none;
}


/* =====================================================
   STRING LABEL
   ===================================================== */

.string-label {

    display: flex;

    align-items: center;

    justify-content: center;

    background: #303030;

    font-size: 14px;

    font-weight: 600;

    border-right: 2px solid #555;
}


/* =====================================================
   FRET
   ===================================================== */

.fret {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    border-right:
        2px solid rgba(255,255,255,0.45);
}

.fret:last-child {
    border-right: none;
}


/* =====================================================
   NOTE
   ===================================================== */

.note {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-weight: 700;

    line-height: 1;

    z-index: 2;

    user-select: none;
}

.note-name {
    font-size: 12px;
}

.note-interval {

    font-size: 10px;

    margin-top: 3px;

    opacity: 0.9;
}

.scale-note {

    background: #f1f1f1;

    color: #111;
}

.root-note {

    background: #e63946;

    color: white;
}


/* =====================================================
   DISPLAY MODES
   ===================================================== */

.mode-notes .note-interval {
    display: none;
}

.mode-intervals .note-name {
    display: none;
}

.mode-intervals .note {
    font-size: 14px;
}


/* =====================================================
   FRET NUMBERS
   ===================================================== */

.fret-number {

    position: absolute;

    bottom: 2px;
    right: 4px;

    font-size: 9px;

    color: rgba(255,255,255,0.5);
}


/* =====================================================
   LEGEND
   ===================================================== */

.legend {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 12px;

    font-size: 13px;

    color: #999;
}

.legend-item {

    display: flex;

    align-items: center;

    gap: 6px;
}

.legend-dot {

    width: 13px;
    height: 13px;

    border-radius: 50%;
}

.root-dot {
    background: #e63946;
}

.scale-dot {
    background: #f1f1f1;
}


/* =====================================================
   DESKTOP
   ===================================================== */

@media (min-width: 700px) {

    .fretboard-wrapper {

        max-width: 700px;

        margin: auto;
    }

    .string {
        height: 70px;
    }

    .note {

        width: 44px;
        height: 44px;
    }

    .note-name {
        font-size: 14px;
    }

    .note-interval {
        font-size: 11px;
    }

    .scale-menu {
        max-height: 500px;
        overflow-y: auto;
    }

}

</style>

</head>

    9: "A",
    10: "Bb",
    11: "B"

};



/*
    Generate the correctly-spelled notes
    of a scale.

    The scale degrees move through the
    seven letter names rather than simply
    choosing enharmonic pitch names.
*/

function getScaleNotes() {

    const root =
        rootSelect.value;

    const scale =
        scales[
            scaleSelect.value
        ];

    const rootPitch =
        chromaticPitch[root];

    const rootLetter =
        root.charAt(0);

    const rootLetterIndex =
        naturalLetters.indexOf(
            rootLetter
        );

    const useFlats =
        flatRoots.includes(root);

    const result = [];


    scale.intervals.forEach(

        (semitones, index) => {

            const targetPitch =
                (
                    rootPitch +
                    semitones
                ) % 12;


            const targetLetter =
                naturalLetters[
                    (
                        rootLetterIndex +
                        index
                    ) % 7
                ];


            const naturalTargetPitch =
                naturalPitch[
                    targetLetter
                ];


            let difference =
                targetPitch -
                naturalTargetPitch;


            while (
                difference > 6
            ) {

                difference -= 12;

            }


            while (
                difference < -6
            ) {

                difference += 12;

            }


            let noteName =
                targetLetter;


            if (
                difference === 1
            ) {

                noteName += "#";

            }

            else if (
                difference === -1
            ) {

                noteName += "b";

            }

            else if (
                difference === 2
            ) {

                noteName += "##";

            }

            else if (
                difference === -2
            ) {

                noteName += "bb";

            }


            /*
                If the spelling is unusual,
                keep the theoretically correct
                spelling when possible.
            */

            if (
                chromaticPitch[noteName] === undefined
            ) {

                noteName =
                    useFlats
                    ? flatNames[targetPitch]
                    : sharpNames[targetPitch];

            }


            result.push(
                noteName
            );

        }

    );


    return result;

}



/* =====================================================
   CURRENT SCALE
   ===================================================== */

function getCurrentScale() {

    return scales[
        scaleSelect.value
    ];

}



/* =====================================================
   INTERVAL
   ===================================================== */

function getInterval(note) {

    const root =
        rootSelect.value;

    const rootPitch =
        chromaticPitch[root];

    const notePitch =
        chromaticPitch[note];

    const distance =
        (
            notePitch -
            rootPitch +
            12
        ) % 12;


    return intervalNames[
        distance
    ];

}



/* =====================================================
   GUITAR
   ===================================================== */

const tuning = [

    "E",
    "A",
    "D",
    "G",
    "B",
    "E"

];


const positions = [

    {
        start: 1,
        end: 5
    },

    {
        start: 4,
        end: 8
    },

    {
        start: 7,
        end: 11
    },

    {
        start: 10,
        end: 14
    },

    {
        start: 13,
        end: 17
    }

];



/* =====================================================
   STATE
   ===================================================== */

let currentPosition = 0;

let displayMode = "notes";



/* =====================================================
   DOM
   ===================================================== */

const rootSelect =
    document.getElementById(
        "rootSelect"
    );

const scaleMenuButton =
    document.getElementById(
        "scaleMenuButton"
    );

const scaleMenu =
    document.getElementById(
        "scaleMenu"
    );

const selectedScaleLabel =
    document.getElementById(
        "selectedScaleLabel"
    );

const fretboard =
    document.getElementById(
        "fretboard"
    );

const scaleName =
    document.getElementById(
        "scaleName"
    );

const notes =
    document.getElementById(
        "notes"
    );

const positionNumber =
    document.getElementById(
        "positionNumber"
    );

const positionFrets =
    document.getElementById(
        "positionFrets"
    );

const positionDots =
    document.getElementById(
        "positionDots"
    );

const previousButton =
    document.getElementById(
        "previousButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const fretboardWrapper =
    document.getElementById(
        "fretboardWrapper"
    );

const displayButtons =
    document.querySelectorAll(
        ".display-button"
    );

const categoryButtons =
    document.querySelectorAll(
        ".category-button"
    );

const scaleOptions =
    document.querySelectorAll(
        ".scale-option"
    );



/* =====================================================
   SCALE MENU
   ===================================================== */


/*
    Open / close the main scale menu.
*/

scaleMenuButton.addEventListener(

    "click",

    event => {

        event.stopPropagation();

        const isOpen =
            scaleMenu.classList.contains(
                "open"
            );


        if (isOpen) {

            closeScaleMenu();

        }

        else {

            scaleMenu.classList.add(
                "open"
            );

            scaleMenuButton.classList.add(
                "open"
            );

        }

    }

);



function closeScaleMenu() {

    scaleMenu.classList.remove(
        "open"
    );

    scaleMenuButton.classList.remove(
        "open"
    );

}



/*
    Expand / collapse categories.
*/

categoryButtons.forEach(

    button => {

        button.addEventListener(

            "click",

            () => {

                const category =
                    button.parentElement;


                category.classList.toggle(
                    "expanded"
                );

            }

        );

    }

);



/*
    Selecting a scale.
*/

scaleOptions.forEach(

    option => {

        option.addEventListener(

            "click",

            () => {

                const selectedScale =
                    option.dataset.scale;


                scaleSelectValue =
                    selectedScale;


                selectedScaleLabel.textContent =
                    scales[
                        selectedScale
                    ].name;


                scaleOptions.forEach(

                    other => {

                        other.classList.remove(
                            "selected"
                        );

                    }

                );


                option.classList.add(
                    "selected"
                );


                currentPosition = 0;


                updateApp();


                closeScaleMenu();

            }

        );

    }

);


/*
    This variable replaces the old
    HTML select for scales.
*/

let scaleSelectValue =
    "major";



/*
    Close menu when tapping elsewhere.
*/

document.addEventListener(

    "click",

    event => {

        if (
            !document
                .getElementById(
                    "scaleMenuWrapper"
                )
                .contains(event.target)
        ) {

            closeScaleMenu();

        }

    }

);



/* =====================================================
   SCALE INFORMATION
   ===================================================== */

function updateScaleInfo() {

    const root =
        rootSelect.value;

    const scale =
        getCurrentScale();

    const scaleNotes =
        getScaleNotes();


    scaleName.textContent =
        `${root} ${scale.name}`;


    notes.textContent =
        scaleNotes.join(
            "  •  "
        );

}



/* =====================================================
   DRAW FRETBOARD
   ===================================================== */

function drawFretboard() {

    const root =
        rootSelect.value;

    const scaleNotes =
        getScaleNotes();

    const position =
        positions[
            currentPosition
        ];


    fretboard.innerHTML = "";


    fretboard.className =
        `fretboard mode-${displayMode}`;



    tuning.forEach(

        openNote => {

            const string =
                document.createElement(
                    "div"
                );


            string.className =
                "string";


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "string-label";


            label.textContent =
                openNote;


            string.appendChild(
                label
            );


            const openPitch =
                chromaticPitch[
                    openNote
                ];



            for (

                let fret =
                    position.start;

                fret <= position.end;

                fret++

            ) {


                const fretElement =
                    document.createElement(
                        "div"
                    );


                fretElement.className =
                    "fret";


                const pitch =
                    (
                        openPitch +
                        fret
                    ) % 12;



                const note =
                    scaleNotes.find(

                        scaleNote =>

                            chromaticPitch[
                                scaleNote
                            ] === pitch

                    );



                if (note) {

                    const noteElement =
                        document.createElement(
                            "div"
                        );


                    noteElement.className =
                        "note " +

                        (
                            note === root

                            ? "root-note"

                            : "scale-note"
                        );


                    const noteName =
                        document.createElement(
                            "div"
                        );


                    noteName.className =
                        "note-name";


                    noteName.textContent =
                        note;


                    const noteInterval =
                        document.createElement(
                            "div"
                        );


                    noteInterval.className =
                        "note-interval";


                    noteInterval.textContent =
                        getInterval(
                            note
                        );


                    noteElement.appendChild(
                        noteName
                    );


                    noteElement.appendChild(
                        noteInterval
                    );


                    fretElement.appendChild(
                        noteElement
                    );

                }



                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "fret-number";


                number.textContent =
                    fret;


                fretElement.appendChild(
                    number
                );


                string.appendChild(
                    fretElement
                );

            }


            fretboard.appendChild(
                string
            );

        }

    );

}



/* =====================================================
   POSITION UI
   ===================================================== */

function updatePositionUI() {

    const position =
        positions[
            currentPosition
        ];


    positionNumber.textContent =

        `Position ${
            currentPosition + 1
        } / ${
            positions.length
        }`;


    positionFrets.textContent =

        `Frets ${
            position.start
        } – ${
            position.end
        }`;


    positionDots.innerHTML = "";


    positions.forEach(

        (_, index) => {

            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "position-dot";


            if (
                index ===
                currentPosition
            ) {

                dot.classList.add(
                    "active"
                );

            }


            positionDots.appendChild(
                dot
            );

        }

    );

}



/* =====================================================
   UPDATE
   ===================================================== */

function updateApp() {

    updateScaleInfo();

    drawFretboard();

    updatePositionUI();

}



/* =====================================================
   ROOT
   ===================================================== */

rootSelect.addEventListener(

    "change",

    () => {

        currentPosition = 0;

        updateApp();

    }

);



/* =====================================================
   POSITION NAVIGATION
   ===================================================== */

nextButton.addEventListener(

    "click",

    () => {

        if (
            currentPosition <
            positions.length - 1
        ) {

            currentPosition++;

            updateApp();

        }

    }

);


previousButton.addEventListener(

    "click",

    () => {

        if (
            currentPosition > 0
        ) {

            currentPosition--;

            updateApp();

        }

    }

);



/* =====================================================
   DISPLAY BUTTONS
   ===================================================== */

displayButtons.forEach(

    button => {

        button.addEventListener(

            "click",

            () => {

                displayButtons.forEach(

                    otherButton => {

                        otherButton.classList.remove(
                            "active"
                        );

                    }

                );


                button.classList.add(
                    "active"
                );


                displayMode =
                    button.dataset.mode;


                drawFretboard();

            }

        );

    }

);



/* =====================================================
   SWIPE
   ===================================================== */

let touchStartX = 0;

let touchEndX = 0;


fretboardWrapper.addEventListener(

    "touchstart",

    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },

    {
        passive: true
    }

);


fretboardWrapper.addEventListener(

    "touchend",

    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        handleSwipe();

    },

    {
        passive: true
    }

);


function handleSwipe() {

    const difference =
        touchEndX -
        touchStartX;


    const minimumSwipe =
        50;


    if (
        Math.abs(difference)
        < minimumSwipe
    ) {

        return;

    }


    if (
        difference < 0
    ) {

        nextButton.click();

    }

    else {

        previousButton.click();

    }

}



/* =====================================================
   START
   ===================================================== */

updateApp();

</script>


<!--
    Hidden select value used by the scale engine.
    The visible custom menu controls the value.
-->

<script>

Object.defineProperty(
    window,
    "scaleSelect",
    {
        get: function() {

            return {

                get value() {

                    return scaleSelectValue;

                }

            };

        }
    }
);

</script>

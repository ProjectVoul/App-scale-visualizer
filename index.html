<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Scale Visualizer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #f5f5f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
    text-align: center;
    padding: 28px 20px 12px;
}

h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
}

.subtitle {
    margin-top: 5px;
    color: #888;
    font-size: 14px;
}


/* =====================================================
   CONTROLS
   ===================================================== */

.controls {
    display: flex;
    gap: 10px;
    padding: 18px 16px;
    width: 100%;
    max-width: 650px;
    margin: auto;
}

select {
    appearance: none;
    -webkit-appearance: none;

    background: #222;
    color: white;

    border: 1px solid #444;
    border-radius: 12px;

    padding: 13px 14px;

    font-size: 16px;

    min-width: 0;
}

#rootSelect {
    width: 95px;
}

#scaleSelect {
    flex: 1;
}


/* =====================================================
   DISPLAY MODE
   ===================================================== */

.display-section {
    text-align: center;
    margin: 0 auto 15px;
}

.display-label {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.display-buttons {
    display: inline-flex;

    background: #222;

    border: 1px solid #444;

    border-radius: 12px;

    padding: 3px;
}

.display-button {
    border: none;

    background: transparent;

    color: #888;

    padding: 8px 13px;

    border-radius: 9px;

    font-size: 14px;

    cursor: pointer;
}

.display-button.active {
    background: #eee;
    color: #111;
}


/* =====================================================
   SCALE INFORMATION
   ===================================================== */

.scale-info {
    text-align: center;
    padding: 5px 20px 18px;
}

.scale-name {
    font-size: 23px;
    font-weight: 600;
}

.notes {
    margin-top: 8px;
    color: #999;
    font-size: 16px;
    letter-spacing: 1px;
    line-height: 1.5;
}


/* =====================================================
   POSITION NAVIGATION
   ===================================================== */

.position-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 12px;
}

.position-button {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 1px solid #444;

    background: #222;

    color: white;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.position-button:active {
    background: #333;
    transform: scale(0.95);
}

.position-title {
    text-align: center;
    min-width: 130px;
}

.position-number {
    font-size: 17px;
    font-weight: 600;
}

.position-frets {
    margin-top: 3px;
    font-size: 12px;
    color: #777;
}

.position-dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 7px;
}

.position-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #444;
}

.position-dot.active {
    background: #eee;
}


/* =====================================================
   FRETBOARD
   ===================================================== */

.fretboard-wrapper {
    width: 100%;
    padding: 0 10px 25px;
    touch-action: pan-y;
}

.fretboard {
    width: 100%;

    border-radius: 10px;

    overflow: hidden;

    border: 2px solid #444;

    background: #8b5a2b;
}

.string {
    display: grid;

    grid-template-columns:
        38px
        repeat(5, 1fr);

    height: 62px;

    border-bottom:
        1px solid rgba(255,255,255,0.28);
}

.string:last-child {
    border-bottom: none;
}


/* =====================================================
   STRING LABEL
   ===================================================== */

.string-label {
    display: flex;

    align-items: center;

    justify-content: center;

    background: #303030;

    font-size: 14px;

    font-weight: 600;

    border-right: 2px solid #555;
}


/* =====================================================
   FRET
   ===================================================== */

.fret {
    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    border-right:
        2px solid rgba(255,255,255,0.45);
}

.fret:last-child {
    border-right: none;
}


/* =====================================================
   NOTE CIRCLE
   ===================================================== */

.note {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-weight: 700;

    line-height: 1;

    z-index: 2;

    user-select: none;
}

.note-name {
    font-size: 12px;
}

.note-interval {
    font-size: 10px;

    margin-top: 3px;

    opacity: 0.9;
}

.scale-note {
    background: #f1f1f1;
    color: #111;
}

.root-note {
    background: #e63946;
    color: white;
}


/* =====================================================
   DISPLAY MODES
   ===================================================== */

.mode-notes .note-interval {
    display: none;
}

.mode-intervals .note-name {
    display: none;
}

.mode-intervals .note {
    font-size: 14px;
}


/* =====================================================
   FRET NUMBERS
   ===================================================== */

.fret-number {
    position: absolute;

    bottom: 2px;

    right: 4px;

    font-size: 9px;

    color: rgba(255,255,255,0.5);
}


/* =====================================================
   LEGEND
   ===================================================== */

.legend {
    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 12px;

    font-size: 13px;

    color: #999;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 6px;
}

.legend-dot {
    width: 13px;
    height: 13px;

    border-radius: 50%;
}

.root-dot {
    background: #e63946;
}

.scale-dot {
    background: #f1f1f1;
}


/* =====================================================
   DESKTOP
   ===================================================== */

@media (min-width: 700px) {

    .fretboard-wrapper {
        max-width: 700px;
        margin: auto;
    }

    .string {
        height: 70px;
    }

    .note {
        width: 44px;
        height: 44px;
    }

    .note-name {
        font-size: 14px;
    }

    .note-interval {
        font-size: 11px;
    }

}

</style>

</head>


<body>


<header>

    <h1>Scale Visualizer</h1>

    <div class="subtitle">
        Guitar • Scales • Notes
    </div>

</header>



<!-- =====================================================
     ROOT + SCALE
     ===================================================== -->

<div class="controls">

    <select id="rootSelect">

        <option value="C">C</option>

        <option value="C#">C#</option>
        <option value="Db">Db</option>

        <option value="D">D</option>

        <option value="D#">D#</option>
        <option value="Eb">Eb</option>

        <option value="E">E</option>

        <option value="F">F</option>

        <option value="F#">F#</option>
        <option value="Gb">Gb</option>

        <option value="G">G</option>

        <option value="G#">G#</option>
        <option value="Ab">Ab</option>

        <option value="A">A</option>

        <option value="A#">A#</option>
        <option value="Bb">Bb</option>

        <option value="B">B</option>

        <option value="Cb">Cb</option>

    </select>


    <select id="scaleSelect">

        <optgroup label="Diatonic">

            <option value="major">
                Major / Ionian
            </option>

            <option value="minor">
                Natural Minor / Aeolian
            </option>

            <option value="dorian">
                Dorian
            </option>

            <option value="phrygian">
                Phrygian
            </option>

            <option value="lydian">
                Lydian
            </option>

            <option value="mixolydian">
                Mixolydian
            </option>

            <option value="locrian">
                Locrian
            </option>

        </optgroup>


        <optgroup label="Minor">

            <option value="harmonicMinor">
                Harmonic Minor
            </option>

            <option value="melodicMinor">
                Melodic Minor
            </option>

        </optgroup>


        <optgroup label="Pentatonic & Blues">

            <option value="majorPentatonic">
                Major Pentatonic
            </option>

            <option value="minorPentatonic">
                Minor Pentatonic
            </option>

            <option value="blues">
                Blues
            </option>

        </optgroup>

    </select>

</div>



<!-- =====================================================
     DISPLAY MODE
     ===================================================== -->

<div class="display-section">

    <div class="display-label">
        Display
    </div>


    <div class="display-buttons">

        <button
            class="display-button active"
            data-mode="notes"
        >
            Notes
        </button>


        <button
            class="display-button"
            data-mode="intervals"
        >
            Intervals
        </button>


        <button
            class="display-button"
            data-mode="both"
        >
            Both
        </button>

    </div>

</div>



<!-- =====================================================
     SCALE INFORMATION
     ===================================================== -->

<div class="scale-info">

    <div
        class="scale-name"
        id="scaleName"
    >
        C Major / Ionian
    </div>


    <div
        class="notes"
        id="notes"
    ></div>

</div>



<!-- =====================================================
     POSITION NAVIGATION
     ===================================================== -->

<div class="position-header">

    <button
        class="position-button"
        id="previousButton"
        aria-label="Previous position"
    >
        ‹
    </button>


    <div class="position-title">

        <div
            class="position-number"
            id="positionNumber"
        >
            Position 1 / 5
        </div>


        <div
            class="position-frets"
            id="positionFrets"
        >
            Frets 1 – 5
        </div>


        <div
            class="position-dots"
            id="positionDots"
        ></div>

    </div>


    <button
        class="position-button"
        id="nextButton"
        aria-label="Next position"
    >
        ›
    </button>

</div>



<!-- =====================================================
     FRETBOARD
     ===================================================== -->

<div
    class="fretboard-wrapper"
    id="fretboardWrapper"
>

    <div
        class="fretboard"
        id="fretboard"
    ></div>


    <div class="legend">

        <div class="legend-item">

            <div class="legend-dot root-dot"></div>

            Root

        </div>


        <div class="legend-item">

            <div class="legend-dot scale-dot"></div>

            Scale note

        </div>

    </div>

</div>



<script>


/* =====================================================
   MUSIC THEORY ENGINE
   ===================================================== */


/*
    Every note has a chromatic pitch.

    Enharmonic notes share the same pitch,
    but are written differently.
*/

const chromaticPitch = {

    "C": 0,

    "C#": 1,
    "Db": 1,

    "D": 2,

    "D#": 3,
    "Eb": 3,

    "E": 4,

    "F": 5,

    "F#": 6,
    "Gb": 6,

    "G": 7,

    "G#": 8,
    "Ab": 8,

    "A": 9,

    "A#": 10,
    "Bb": 10,

    "B": 11,

    "Cb": 11

};



/*
    Natural notes.
*/

const naturalPitch = {

    "C": 0,
    "D": 2,
    "E": 4,
    "F": 5,
    "G": 7,
    "A": 9,
    "B": 11

};


const naturalLetters = [

    "C",
    "D",
    "E",
    "F",
    "G",
    "A",
    "B"

];



/*
    Simple interval names.

    These are useful as scale-degree descriptions.
*/

const intervalNames = {

    0: "R",

    1: "m2",

    2: "M2",

    3: "m3",

    4: "M3",

    5: "P4",

    6: "TT",

    7: "P5",

    8: "m6",

    9: "M6",

    10: "m7",

    11: "M7"

};



/* =====================================================
   SCALE DEFINITIONS
   ===================================================== */

const scales = {


    major: {

        name: "Major / Ionian",

        intervals: [
            0, 2, 4, 5, 7, 9, 11
        ]

    },


    minor: {

        name: "Natural Minor / Aeolian",

        intervals: [
            0, 2, 3, 5, 7, 8, 10
        ]

    },


    dorian: {

        name: "Dorian",

        intervals: [
            0, 2, 3, 5, 7, 9, 10
        ]

    },


    phrygian: {

        name: "Phrygian",

        intervals: [
            0, 1, 3, 5, 7, 8, 10
        ]

    },


    lydian: {

        name: "Lydian",

        intervals: [
            0, 2, 4, 6, 7, 9, 11
        ]

    },


    mixolydian: {

        name: "Mixolydian",

        intervals: [
            0, 2, 4, 5, 7, 9, 10
        ]

    },


    locrian: {

        name: "Locrian",

        intervals: [
            0, 1, 3, 5, 6, 8, 10
        ]

    },


    harmonicMinor: {

        name: "Harmonic Minor",

        intervals: [
            0, 2, 3, 5, 7, 8, 11
        ]

    },


    melodicMinor: {

        name: "Melodic Minor",

        intervals: [
            0, 2, 3, 5, 7, 9, 11
        ]

    },


    majorPentatonic: {

        name: "Major Pentatonic",

        intervals: [
            0, 2, 4, 7, 9
        ]

    },


    minorPentatonic: {

        name: "Minor Pentatonic",

        intervals: [
            0, 3, 5, 7, 10
        ]

    },


    blues: {

        name: "Blues",

        intervals: [
            0, 3, 5, 6, 7, 10
        ]

    }

};



/* =====================================================
   SCALE SPELLING
   ===================================================== */

const flatRoots = [

    "F",
    "Bb",
    "Eb",
    "Ab",
    "Db",
    "Gb",
    "Cb"

];


const sharpRoots = [

    "G",
    "D",
    "A",
    "E",
    "B",
    "F#",
    "C#"

];


const sharpNames = {

    0: "C",
    1: "C#",
    2: "D",
    3: "D#",
    4: "E",
    5: "F",
    6: "F#",
    7: "G",
    8: "G#",
    9: "A",
    10: "A#",
    11: "B"

};


const flatNames = {

    0: "C",
    1: "Db",
    2: "D",
    3: "Eb",
    4: "E",
    5: "F",
    6: "Gb",
    7: "G",
    8: "Ab",
    9: "A",
    10: "Bb",
    11: "B"

};



function getScaleNotes() {

    const root =
        rootSelect.value;

    const scale =
        scales[
            scaleSelect.value
        ];

    const rootPitch =
        chromaticPitch[root];

    const rootLetter =
        root.charAt(0);

    const rootLetterIndex =
        naturalLetters.indexOf(
            rootLetter
        );

    const useFlats =
        flatRoots.includes(root);

    const result = [];


    scale.intervals.forEach(

        (semitones, index) => {

            const targetPitch =
                (
                    rootPitch +
                    semitones
                ) % 12;


            const targetLetter =
                naturalLetters[
                    (
                        rootLetterIndex +
                        index
                    ) % 7
                ];


            const naturalTargetPitch =
                naturalPitch[
                    targetLetter
                ];


            let difference =
                targetPitch -
                naturalTargetPitch;


            while (
                difference > 6
            ) {

                difference -= 12;

            }


            while (
                difference < -6
            ) {

                difference += 12;

            }


            let noteName =
                targetLetter;


            if (
                difference === 1
            ) {

                noteName += "#";

            }

            else if (
                difference === -1
            ) {

                noteName += "b";

            }

            else if (
                difference === 2
            ) {

                noteName += "##";

            }

            else if (
                difference === -2
            ) {

                noteName += "bb";

            }


            /*
                Fallback for unusual theoretical
                spellings.
            */

            if (
                chromaticPitch[noteName] === undefined
            ) {

                noteName =
                    useFlats
                    ? flatNames[targetPitch]
                    : sharpNames[targetPitch];

            }


            result.push(
                noteName
            );

        }

    );


    return result;

}



/* =====================================================
   CURRENT SCALE
   ===================================================== */

function getCurrentScale() {

    return scales[
        scaleSelect.value
    ];

}



/* =====================================================
   INTERVAL FROM ROOT
   ===================================================== */

function getInterval(note) {

    const root =
        rootSelect.value;

    const rootPitch =
        chromaticPitch[root];

    const notePitch =
        chromaticPitch[note];

    const distance =
        (
            notePitch -
            rootPitch +
            12
        ) % 12;


    return intervalNames[
        distance
    ];

}



/* =====================================================
   GUITAR
   ===================================================== */

const tuning = [

    "E",
    "A",
    "D",
    "G",
    "B",
    "E"

];


const positions = [

    {
        start: 1,
        end: 5
    },

    {
        start: 4,
        end: 8
    },

    {
        start: 7,
        end: 11
    },

    {
        start: 10,
        end: 14
    },

    {
        start: 13,
        end: 17
    }

];



/* =====================================================
   STATE
   ===================================================== */

let currentPosition = 0;

let displayMode = "notes";



/* =====================================================
   DOM
   ===================================================== */

const rootSelect =
    document.getElementById(
        "rootSelect"
    );


const scaleSelect =
    document.getElementById(
        "scaleSelect"
    );


const fretboard =
    document.getElementById(
        "fretboard"
    );


const scaleName =
    document.getElementById(
        "scaleName"
    );


const notes =
    document.getElementById(
        "notes"
    );


const positionNumber =
    document.getElementById(
        "positionNumber"
    );


const positionFrets =
    document.getElementById(
        "positionFrets"
    );


const positionDots =
    document.getElementById(
        "positionDots"
    );


const previousButton =
    document.getElementById(
        "previousButton"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const fretboardWrapper =
    document.getElementById(
        "fretboardWrapper"
    );


const displayButtons =
    document.querySelectorAll(
        ".display-button"
    );



/* =====================================================
   SCALE INFORMATION
   ===================================================== */

function updateScaleInfo() {

    const root =
        rootSelect.value;

    const scale =
        getCurrentScale();

    const scaleNotes =
        getScaleNotes();


    scaleName.textContent =
        `${root} ${scale.name}`;


    notes.textContent =
        scaleNotes.join("  •  ");

}



/* =====================================================
   DRAW FRETBOARD
   ===================================================== */

function drawFretboard() {

    const root =
        rootSelect.value;

    const scaleNotes =
        getScaleNotes();

    const position =
        positions[
            currentPosition
        ];


    fretboard.innerHTML = "";


    fretboard.className =
        `fretboard mode-${displayMode}`;



    tuning.forEach(

        openNote => {

            const string =
                document.createElement(
                    "div"
                );


            string.className =
                "string";



            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "string-label";


            label.textContent =
                openNote;


            string.appendChild(
                label
            );



            const openPitch =
                chromaticPitch[
                    openNote
                ];



            for (

                let fret =
                    position.start;

                fret <= position.end;

                fret++

            ) {


                const fretElement =
                    document.createElement(
                        "div"
                    );


                fretElement.className =
                    "fret";



                const pitch =
                    (
                        openPitch +
                        fret
                    ) % 12;



                /*
                    Find the correctly-spelled
                    scale note at this pitch.
                */

                const note =
                    scaleNotes.find(

                        scaleNote =>

                            chromaticPitch[
                                scaleNote
                            ] === pitch

                    );



                if (note) {


                    const noteElement =
                        document.createElement(
                            "div"
                        );


                    noteElement.className =
                        "note " +

                        (
                            note === root

                            ? "root-note"

                            : "scale-note"
                        );



                    const noteName =
                        document.createElement(
                            "div"
                        );


                    noteName.className =
                        "note-name";


                    noteName.textContent =
                        note;



                    const noteInterval =
                        document.createElement(
                            "div"
                        );


                    noteInterval.className =
                        "note-interval";


                    noteInterval.textContent =
                        getInterval(
                            note
                        );



                    noteElement.appendChild(
                        noteName
                    );


                    noteElement.appendChild(
                        noteInterval
                    );


                    fretElement.appendChild(
                        noteElement
                    );

                }



                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "fret-number";


                number.textContent =
                    fret;


                fretElement.appendChild(
                    number
                );


                string.appendChild(
                    fretElement
                );

            }



            fretboard.appendChild(
                string
            );

        }

    );

}



/* =====================================================
   POSITION UI
   ===================================================== */

function updatePositionUI() {

    const position =
        positions[
            currentPosition
        ];


    positionNumber.textContent =

        `Position ${
            currentPosition + 1
        } / ${
            positions.length
        }`;


    positionFrets.textContent =

        `Frets ${
            position.start
        } – ${
            position.end
        }`;


    positionDots.innerHTML = "";


    positions.forEach(

        (_, index) => {

            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "position-dot";


            if (
                index ===
                currentPosition
            ) {

                dot.classList.add(
                    "active"
                );

            }


            positionDots.appendChild(
                dot
            );

        }

    );

}



/* =====================================================
   UPDATE APP
   ===================================================== */

function updateApp() {

    updateScaleInfo();

    drawFretboard();

    updatePositionUI();

}



/* =====================================================
   NAVIGATION
   ===================================================== */

function nextPosition() {

    if (
        currentPosition <
        positions.length - 1
    ) {

        currentPosition++;

        updateApp();

    }

}


function previousPosition() {

    if (
        currentPosition > 0
    ) {

        currentPosition--;

        updateApp();

    }

}


nextButton.addEventListener(
    "click",
    nextPosition
);


previousButton.addEventListener(
    "click",
    previousPosition
);



/* =====================================================
   SELECTORS
   ===================================================== */

rootSelect.addEventListener(

    "change",

    () => {

        currentPosition = 0;

        updateApp();

    }

);


scaleSelect.addEventListener(

    "change",

    () => {

        currentPosition = 0;

        updateApp();

    }

);



/* =====================================================
   DISPLAY BUTTONS
   ===================================================== */

displayButtons.forEach(

    button => {

        button.addEventListener(

            "click",

            () => {

                displayButtons.forEach(

                    otherButton => {

                        otherButton.classList.remove(
                            "active"
                        );

                    }

                );


                button.classList.add(
                    "active"
                );


                displayMode =
                    button.dataset.mode;


                drawFretboard();

            }

        );

    }

);



/* =====================================================
   SWIPE
   ===================================================== */

let touchStartX = 0;

let touchEndX = 0;


fretboardWrapper.addEventListener(

    "touchstart",

    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },

    {
        passive: true
    }

);


fretboardWrapper.addEventListener(

    "touchend",

    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        handleSwipe();

    },

    {
        passive: true
    }

);


function handleSwipe() {

    const difference =
        touchEndX -
        touchStartX;


    const minimumSwipe =
        50;


    if (
        Math.abs(difference)
        < minimumSwipe
    ) {

        return;

    }


    if (
        difference < 0
    ) {

        nextPosition();

    }

    else {

        previousPosition();

    }

}



/* =====================================================
   START
   ===================================================== */

updateApp();

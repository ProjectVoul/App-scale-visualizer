<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scale Visualizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            padding: 24px 20px 10px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 6px;
            color: #888;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 20px;
            justify-content: center;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
        }

        .scale-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .scale-name {
            font-size: 20px;
            font-weight: 600;
        }

        .notes {
            color: #999;
            margin-top: 6px;
        }

        .fretboard-container {
            overflow-x: auto;
            padding: 0 15px 30px;
        }

        .fretboard {
            min-width: 900px;
            background: #8b5a2b;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
        }

        .string {
            display: flex;
            height: 48px;
            border-bottom: 1px solid rgba(255,255,255,0.25);
        }

        .string:last-child {
            border-bottom: none;
        }

        .open-string {
            width: 45px;
            flex-shrink: 0;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-right: 2px solid #555;
        }

        .fret {
            width: 58px;
            flex-shrink: 0;
            border-right: 2px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .note {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .scale-note {
            background: #eee;
            color: #111;
        }

        .root-note {
            background: #e63946;
            color: white;
        }

        .fret-number {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 9px;
            color: rgba(255,255,255,0.5);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .root-dot {
            background: #e63946;
        }

        .scale-dot {
            background: #eee;
        }
    </style>
</head>

<body>

<header>
    <h1>Scale Visualizer</h1>
    <div class="subtitle">Guitar • Scales • Notes</div>
</header>

<div class="controls">

    <select id="rootSelect">
        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>
    </select>

    <select id="scaleSelect">
        <option value="major">Major</option>
        <option value="minor">Natural Minor</option>
        <option value="pentatonic">Minor Pentatonic</option>
        <option value="blues">Blues</option>
        <option value="dorian">Dorian</option>
        <option value="mixolydian">Mixolydian</option>
    </select>

</div>

<div class="scale-info">
    <div class="scale-name" id="scaleName">C Major</div>
    <div class="notes" id="notes"></div>
</div>

<div class="fretboard-container">
    <div class="fretboard" id="fretboard"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot root-dot"></div>
            Root
        </div>

        <div class="legend-item">
            <div class="legend-dot scale-dot"></div>
            Scale note
        </div>
    </div>
</div>

<script>

    const noteNames = [
        "C", "C#", "D", "D#", "E", "F",
        "F#", "G", "G#", "A", "A#", "B"
    ];

    const scales = {

        major: {
            name: "Major",
            intervals: [0, 2, 4, 5, 7, 9, 11]
        },

        minor: {
            name: "Natural Minor",
            intervals: [0, 2, 3, 5, 7, 8, 10]
        },

        pentatonic: {
            name: "Minor Pentatonic",
            intervals: [0, 3, 5, 7, 10]
        },

        blues: {
            name: "Blues",
            intervals: [0, 3, 5, 6, 7, 10]
        },

        dorian: {
            name: "Dorian",
            intervals: [0, 2, 3, 5, 7, 9, 10]
        },

        mixolydian: {
            name: "Mixolydian",
            intervals: [0, 2, 4, 5, 7, 9, 10]
        }

    };

    // Standard guitar tuning
    const tuning = ["E", "A", "D", "G", "B", "E"];

    const rootSelect = document.getElementById("rootSelect");
    const scaleSelect = document.getElementById("scaleSelect");

    function getScaleNotes() {

        const root = rootSelect.value;
        const rootIndex = noteNames.indexOf(root);

        const intervals = scales[scaleSelect.value].intervals;

        return intervals.map(interval =>
            noteNames[(rootIndex + interval) % 12]
        );
    }

    function updateScale() {

        const root = rootSelect.value;
        const scale = scales[scaleSelect.value];

        const scaleNotes = getScaleNotes();

        document.getElementById("scaleName").textContent =
            `${root} ${scale.name}`;

        document.getElementById("notes").textContent =
            scaleNotes.join("  •  ");

        drawFretboard(scaleNotes);
    }

    function drawFretboard(scaleNotes) {

        const fretboard = document.getElementById("fretboard");

        fretboard.innerHTML = "";

        tuning.forEach(openNote => {

            const string = document.createElement("div");
            string.className = "string";

            const openLabel = document.createElement("div");
            openLabel.className = "open-string";
            openLabel.textContent = openNote;

            string.appendChild(openLabel);

            for (let fret = 0; fret <= 15; fret++) {

                const fretElement = document.createElement("div");
                fretElement.className = "fret";

                const openIndex = noteNames.indexOf(openNote);

                const note =
                    noteNames[(openIndex + fret) % 12];

                if (scaleNotes.includes(note)) {

                    const noteElement = document.createElement("div");

                    noteElement.className =
                        "note " +
                        (note === rootSelect.value
                            ? "root-note"
                            : "scale-note");

                    noteElement.textContent = note;

                    fretElement.appendChild(noteElement);
                }

                if (fret > 0) {

                    const number = document.createElement("div");

                    number.className = "fret-number";

                    number.textContent = fret;

                    fretElement.appendChild(number);
                }

                string.appendChild(fretElement);
            }

            fretboard.appendChild(string);
        });
    }

    rootSelect.addEventListener("change", updateScale);
    scaleSelect.addEventListener("change", updateScale);

    updateScale();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Scale Visualizer</title>

<style>
:root {
    --bg: #101010;
    --panel: #202020;
    --panel-light: #292929;
    --border: #404040;
    --text: #f5f5f5;
    --muted: #999;
    --fretboard: #925f2b;
    --fret-line: rgba(255,255,255,0.28);
    --root: #ef3349;
    --note: #f4f4f4;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 18px 60px;
}

/* ---------------- HEADER ---------------- */

.header {
    text-align: center;
    margin-bottom: 28px;
}

.title {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1.5px;
    margin: 0;
}

.subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 19px;
    letter-spacing: 0.5px;
}

/* ---------------- SELECTORS ---------------- */

.controls {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
}

.root-select,
.scale-button {
    height: 60px;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 18px;
    color: var(--text);
    font-size: 20px;
}

.root-select {
    width: 150px;
    padding: 0 18px;
}

.scale-menu-wrapper {
    position: relative;
    flex: 1;
}

.scale-button {
    width: 100%;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    cursor: pointer;
}

.scale-button span:last-child {
    color: var(--muted);
    font-size: 14px;
}

/* ---------------- SCALE MENU ---------------- */

.scale-menu {
    position: absolute;
    z-index: 100;
    top: calc(100% + 8px);
    left: 0;
    width: 100%;
    max-height: 70vh;
    overflow-y: auto;

    background: #1d1d1d;
    border: 2px solid var(--border);
    border-radius: 24px;

    box-shadow: 0 18px 45px rgba(0,0,0,0.45);

    display: none;
}

.scale-menu.open {
    display: block;
}

.category {
    border-bottom: 1px solid #353535;
}

.category:last-child {
    border-bottom: none;
}

.category-header {
    min-height: 66px;
    padding: 0 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #bdbdbd;

    cursor: pointer;
}

.category-arrow {
    color: #888;
    font-size: 16px;
}

.category-items {
    display: none;
    padding: 0 10px 10px;
}

.category.open .category-items {
    display: block;
}

.scale-option {
    width: 100%;
    min-height: 54px;
    border: none;
    border-radius: 14px;

    background: transparent;
    color: var(--text);

    text-align: left;
    padding: 0 16px;

    font-size: 17px;
    cursor: pointer;
}

.scale-option:hover {
    background: #2a2a2a;
}

.scale-option.selected {
    background: #f2f2f2;
    color: #151515;
}

/* ---------------- DISPLAY ---------------- */

.display-title {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.display-switch {
    width: 440px;
    max-width: 100%;
    margin: 0 auto 28px;

    height: 58px;
    padding: 4px;

    display: flex;

    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 18px;
}

.display-switch button {
    flex: 1;
    border: none;
    border-radius: 14px;

    background: transparent;
    color: var(--muted);

    font-size: 17px;
    cursor: pointer;
}

.display-switch button.active {
    background: #f2f2f2;
    color: #111;
}

/* ---------------- SCALE INFO ---------------- */

.scale-info {
    text-align: center;
    margin-bottom: 24px;
}

.scale-name {
    margin: 0;
    font-size: 38px;
    letter-spacing: -0.8px;
}

.scale-notes {
    margin-top: 12px;
    color: var(--muted);
    font-size: 20px;
    letter-spacing: 1px;
}

/* ---------------- POSITION NAV ---------------- */

.position-area {
    text-align: center;
    margin-bottom: 20px;
}

.position-label {
    font-size: 27px;
    font-weight: 700;
}

.fret-range {
    margin-top: 4px;
    color: var(--muted);
    font-size: 17px;
}

.position-nav {
    margin: 12px auto 0;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 35px;
}

.position-arrow {
    width: 58px;
    height: 58px;

    border-radius: 50%;
    border: 2px solid var(--border);

    background: var(--panel);
    color: white;

    font-size: 32px;
    line-height: 1;

    cursor: pointer;
}

.position-arrow:active {
    transform: scale(0.95);
}

.position-dots {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;
    background: #444;
}

.dot.active {
    background: #f4f4f4;
}

/* ---------------- FRETBOARD ---------------- */

.fretboard-wrapper {
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    border: 3px solid #4b4b4b;
}

.fretboard {
    display: grid;
    grid-template-columns: 78px repeat(5, 1fr);
    background: var(--fretboard);
}

.string-name {
    min-height: 116px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #303030;
    border-right: 2px solid #444;

    font-size: 25px;
    font-weight: 600;
}

.fret {
    position: relative;
    min-height: 116px;

    border-right: 2px solid var(--fret-line);
    border-bottom: 2px solid var(--fret-line);
}

.fret:nth-last-child(-n+6) {
    border-bottom: none;
}

.fret-number {
    position: absolute;
    right: 7px;
    bottom: 4px;

    color: rgba(255,255,255,0.58);
    font-size: 14px;
}

.note-marker {
    position: absolute;

    width: 60px;
    height: 60px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: var(--note);
    color: #151515;

    font-weight: 700;
}

.note-name {
    font-size: 17px;
    line-height: 18px;
}

.interval-name {
    margin-top: 2px;
    font-size: 14px;
    line-height: 15px;
}

.note-marker.root {
    background: var(--root);
    color: white;
}

/* ---------------- LEGEND ---------------- */

.legend {
    display: flex;
    justify-content: center;
    gap: 28px;

    margin-top: 18px;

    color: var(--muted);
    font-size: 18px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
}

.legend-dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
}

.legend-root {
    background: var(--root);
}

.legend-note {
    background: var(--note);
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 600px) {

    .app {
        padding: 28px 12px 50px;
    }

    .title {
        font-size: 34px;
    }

    .subtitle {
        font-size: 16px;
    }

    .controls {
        gap: 10px;
    }

    .root-select,
    .scale-button {
        height: 58px;
        border-radius: 16px;
        font-size: 18px;
    }

    .root-select {
        width: 135px;
    }

    .scale-button {
        padding: 0 16px;
    }

    .scale-menu {
        border-radius: 20px;
    }

    .category-header {
        min-height: 62px;
        font-size: 15px;
        padding: 0 18px;
    }

    .scale-option {
        min-height: 52px;
        font-size: 16px;
    }

    .display-switch {
        margin-bottom: 24px;
    }

    .display-switch button {
        font-size: 16px;
    }

    .scale-name {
        font-size: 31px;
    }

    .scale-notes {
        font-size: 18px;
    }

    .position-label {
        font-size: 25px;
    }

    .position-nav {
        gap: 25px;
    }

    .position-arrow {
        width: 54px;
        height: 54px;
    }

    .fretboard {
        grid-template-columns: 68px repeat(5, 1fr);
    }

    .string-name {
        min-height: 105px;
        font-size: 22px;
    }

    .fret {
        min-height: 105px;
    }

    .note-marker {
        width: 56px;
        height: 56px;
    }

    .note-name {
        font-size: 16px;
    }

    .interval-name {
        font-size: 13px;
    }

    .legend {
        font-size: 17px;
    }
}
</style>
</head>

];


/* =========================================================
   GUITAR
   ========================================================= */

const STRINGS = [
    { name: "E", pitch: 4 },
    { name: "A", pitch: 9 },
    { name: "D", pitch: 2 },
    { name: "G", pitch: 7 },
    { name: "B", pitch: 11 },

/*

*/

const POSITIONS = [

    { start: 10, end: 14 },

];


/* =========================================================

/* =========================================================
   NOTE / SPELLING HELPERS
   ========================================================= */

function normalizePitch(pitch) {
    return ((pitch % 12) + 12) % 12;
}


function noteToPitch(note) {
    return SEMITONE_FROM_C[note];
}


function getRootLetter(root) {
    return root[0];
}


function accidentalValue(symbol) {

    if (!symbol) return 0;

    let value = 0;

    for (const char of symbol) {

        if (char === "#") value++;
        if (char === "b") value--;

    }

    return value;
}


function parseDegree(degree) {

    if (typeof degree === "number") {
        return {
            number: degree,
            accidental: ""
        };
    }

    const match = degree.match(/^([b#]*)([1-7])$/);

    return {
        number: Number(match[2]),
        accidental: match[1] || ""
    };
}


/*
    Returns the theoretical letter belonging to a degree.

    Example:
    C + 3 = E
    C + b3 = Eb
    F + 4 = Bb
*/

function getDegreeLetter(root, degreeNumber) {

    const rootLetter = getRootLetter(root);
    const rootIndex = LETTER_INDEX[rootLetter];

    return LETTERS[
        (rootIndex + degreeNumber - 1) % 7
    ];
}


/*
    Finds the correctly spelled note for a theoretical degree.

    We calculate:
        target pitch
        expected letter
        required accidental

    This prevents enharmonic nonsense such as D# where Eb
    is theoretically required.
*/

function getSpelledNote(root, degree) {

    const parsed = parseDegree(degree);

    const rootPitch = noteToPitch(root);
    const targetPitch =
        normalizePitch(rootPitch + getDegreeSemitoneOffset(degree));

    const letter =
        getDegreeLetter(root, parsed.number);

    const naturalPitch =
        noteToPitch(letter);

    let accidental =
        targetPitch - naturalPitch;

    while (accidental > 6) accidental -= 12;
    while (accidental < -6) accidental += 12;

    let accidentalSymbol = "";

    if (accidental > 0) {
        accidentalSymbol = "#".repeat(accidental);
    }

    if (accidental < 0) {
        accidentalSymbol = "b".repeat(Math.abs(accidental));
    }

    return letter + accidentalSymbol;
}


function getDegreeSemitoneOffset(degree) {

    const parsed = parseDegree(degree);

    const base = {
        1: 0,
        2: 2,
        3: 4,
        4: 5,
        5: 7,
        6: 9,
        7: 11
    };

    return base[parsed.number] +
        accidentalValue(parsed.accidental);
}


/* =========================================================
   INTERVAL NAMES
   ========================================================= */

function getIntervalName(degree) {

    const parsed = parseDegree(degree);

    if (parsed.number === 1 && !parsed.accidental) {
        return "R";
    }

    const semitones =
        getDegreeSemitoneOffset(degree);

    const intervalTable = {

        0: "R",

        1: "m2",
        2: "M2",

        3: "m3",
        4: "M3",

        5: "P4",
        6: "TT",
        7: "P5",

        8: "m6",
        9: "M6",

        10: "m7",
        11: "M7"
    };

    return intervalTable[
        normalizePitch(semitones)
    ] || "";
}


/* =========================================================
   SCALE CALCULATION
   ========================================================= */

function getScaleData() {

    const scale =
        SCALES[currentScale];

    return scale.degrees.map(([degree, semitone]) => {

        return {
            degree,
            semitone: normalizePitch(
                noteToPitch(currentRoot) + semitone
            ),
            note: getSpelledNote(
                currentRoot,
                degree
            ),
            interval: getIntervalName(degree)
        };

    });
}


function getScalePitchSet() {

    const data = getScaleData();

    const map = {};

    data.forEach(item => {
        map[item.semitone] = item;
    });

    return map;
}


/* =========================================================
   SCALE MENU
   ========================================================= */

function buildScaleMenu() {

    scaleMenu.innerHTML = "";

    CATEGORY_ORDER.forEach(categoryName => {

        const category = document.createElement("div");
        category.className = "category";

        const header =
            document.createElement("div");

        header.className = "category-header";

        header.innerHTML = `
            <span>${categoryName}</span>
            <span class="category-arrow">›</span>
        `;

        const items =
            document.createElement("div");

        items.className = "category-items";

        Object.keys(SCALES).forEach(scaleNameValue => {

            if (
                SCALES[scaleNameValue].category !==
                categoryName
            ) {
                return;
            }

            const option =
                document.createElement("button");

            option.className = "scale-option";

            if (scaleNameValue === currentScale) {
                option.classList.add("selected");
            }

            option.textContent =
                scaleNameValue;

            option.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    currentScale =
                        scaleNameValue;

                    currentPosition = 0;

                    selectedScaleName.textContent =
                        currentScale;

                    closeScaleMenu();

                    buildScaleMenu();
                    render();

                }
            );

            items.appendChild(option);

        });

        header.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                const alreadyOpen =
                    category.classList.contains("open");

                document
                    .querySelectorAll(".category")
                    .forEach(other => {

                        other.classList.remove("open");

                        const arrow =
                            other.querySelector(
                                ".category-arrow"
                            );

                        if (arrow) {
                            arrow.textContent = "›";
                        }

                    });

                if (!alreadyOpen) {

                    category.classList.add("open");

                    header
                        .querySelector(".category-arrow")
                        .textContent = "⌄";

                }

            }
        );

        category.appendChild(header);
        category.appendChild(items);

        scaleMenu.appendChild(category);

    });

}


function openScaleMenu() {

    scaleMenu.classList.add("open");
    scaleArrow.textContent = "▴";

}


function closeScaleMenu() {

    scaleMenu.classList.remove("open");
    scaleArrow.textContent = "▾";

}


scaleButton.addEventListener("click", event => {

    event.stopPropagation();

    if (scaleMenu.classList.contains("open")) {
        closeScaleMenu();
    } else {
        openScaleMenu();
    }

});


document.addEventListener("click", () => {
    closeScaleMenu();
});


scaleMenu.addEventListener("click", event => {
    event.stopPropagation();
});


/* =========================================================
   ROOT
   ========================================================= */

rootSelect.addEventListener("change", () => {

    currentRoot =
        rootSelect.value;

    render();

});


/* =========================================================
   DISPLAY MODE
   ========================================================= */

document
    .querySelectorAll(".display-switch button")
    .forEach(button => {

        button.addEventListener("click", () => {

            currentDisplay =
                button.dataset.display;

            document
                .querySelectorAll(
                    ".display-switch button"
                )
                .forEach(other => {

                    other.classList.remove(
                        "active"
                    );

                });

            button.classList.add("active");

            render();

        });

    });


/* =========================================================
   POSITION NAVIGATION
   ========================================================= */

function updatePosition(delta) {

    currentPosition += delta;

    if (currentPosition < 0) {
        currentPosition =
            POSITIONS.length - 1;
    }

    if (
        currentPosition >=
        POSITIONS.length
    ) {
        currentPosition = 0;
    }

    render();

}


previousPosition.addEventListener(
    "click",
    () => updatePosition(-1)
);


nextPosition.addEventListener(
    "click",
    () => updatePosition(1)
);


/* =========================================================
   POSITION DOTS
   ========================================================= */

function renderPositionDots() {

    positionDots.innerHTML = "";

    POSITIONS.forEach((_, index) => {

        const dot =
            document.createElement("div");

        dot.className = "dot";

        if (index === currentPosition) {
            dot.classList.add("active");
        }

        positionDots.appendChild(dot);

    });

}


/* =========================================================
   FRETBOARD
   ========================================================= */

function renderFretboard() {

    fretboard.innerHTML = "";

    const position =
        POSITIONS[currentPosition];

    const scaleMap =
        getScalePitchSet();

    /*
        String labels
    */

    STRINGS.forEach(string => {

        const label =
            document.createElement("div");

        label.className = "string-name";
        label.textContent = string.name;

        fretboard.appendChild(label);

        for (
            let fret = position.start;
            fret <= position.end;
            fret++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "fret";

            const pitch =
                normalizePitch(
                    string.pitch + fret
                );

            const scaleNote =
                scaleMap[pitch];

            if (scaleNote) {

                const marker =
                    document.createElement("div");

                marker.className =
                    "note-marker";

                if (
                    scaleNote.degree === 1
                ) {
                    marker.classList.add("root");
                }

                const noteElement =
                    document.createElement("div");

                noteElement.className =
                    "note-name";

                const intervalElement =
                    document.createElement("div");

                intervalElement.className =
                    "interval-name";


                /*
                    Display modes
                */

                if (
                    currentDisplay === "notes"
                ) {

                    noteElement.textContent =
                        scaleNote.note;

                    intervalElement.textContent =
                        "";

                }

                else if (
                    currentDisplay === "intervals"
                ) {

                    noteElement.textContent =
                        scaleNote.interval;

                    intervalElement.textContent =
                        "";

                }

                else {

                    noteElement.textContent =
                        scaleNote.note;

                    intervalElement.textContent =
                        scaleNote.interval;

                }


                marker.appendChild(
                    noteElement
                );

                if (
                    currentDisplay === "both"
                ) {

                    marker.appendChild(
                        intervalElement
                    );

                }

                cell.appendChild(marker);

            }

            const number =
                document.createElement("div");

            number.className =
                "fret-number";

            number.textContent =
                fret;

            cell.appendChild(number);

            fretboard.appendChild(cell);

        }

    });

}


/* =========================================================
   INFO
   ========================================================= */

function renderScaleInfo() {

    const data =
        getScaleData();

    scaleName.textContent =
        `${currentRoot} ${currentScale}`;

    scaleNotes.textContent =
        data
            .map(item => item.note)
            .join(" · ");

    selectedScaleName.textContent =
        currentScale;

}


function renderPositionInfo() {

    const position =
        POSITIONS[currentPosition];

    positionLabel.textContent =
        `Position ${currentPosition + 1} / ${POSITIONS.length}`;

    fretRange.textContent =
        `Frets ${position.start} – ${position.end}`;

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render() {

    renderScaleInfo();
    renderPositionInfo();
    renderPositionDots();
    renderFretboard();

}


/* =========================================================
   SWIPE SUPPORT
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;

const SWIPE_THRESHOLD = 50;

const fretboardWrapper =
    document.getElementById(
        "fretboardWrapper"
    );

fretboardWrapper.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


fretboardWrapper.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchEndX - touchStartX;

        if (
            Math.abs(difference) >=
            SWIPE_THRESHOLD
        ) {

            if (difference < 0) {
                updatePosition(1);
            } else {
                updatePosition(-1);
            }

        }

    },
    { passive: true }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

buildScaleMenu();
render();

</script>

</body>
</html>

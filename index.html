<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Scale Visualizer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #f5f5f5;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow-x: hidden;
        }

        /* ---------------- HEADER ---------------- */

        header {
            text-align: center;
            padding: 28px 20px 12px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 5px;
            color: #888;
            font-size: 14px;
        }


        /* ---------------- CONTROLS ---------------- */

        .controls {
            display: flex;
            gap: 10px;

            padding: 18px 16px;

            width: 100%;
            max-width: 600px;

            margin: auto;
        }

        select {
            appearance: none;
            -webkit-appearance: none;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 12px;

            padding: 13px 14px;

            font-size: 16px;

            min-width: 0;
        }

        #rootSelect {
            width: 90px;
        }

        #scaleSelect {
            flex: 1;
        }


        /* ---------------- SCALE INFO ---------------- */

        .scale-info {
            text-align: center;
            padding: 5px 20px 18px;
        }

        .scale-name {
            font-size: 23px;
            font-weight: 600;
        }

        .notes {
            margin-top: 8px;

            color: #999;

            font-size: 16px;
            letter-spacing: 1px;

            line-height: 1.5;
        }


        /* ---------------- POSITION NAVIGATION ---------------- */

        .position-header {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-bottom: 12px;
        }

        .position-button {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            border: 1px solid #444;

            background: #222;
            color: white;

            font-size: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .position-button:active {
            background: #333;
            transform: scale(0.95);
        }

        .position-title {
            text-align: center;

            min-width: 130px;
        }

        .position-number {
            font-size: 17px;
            font-weight: 600;
        }

        .position-frets {
            margin-top: 3px;

            font-size: 12px;

            color: #777;
        }


        /* ---------------- FRETBOARD ---------------- */

        .fretboard-wrapper {
            width: 100%;

            padding: 0 10px 25px;

            touch-action: pan-y;
        }

        .fretboard {
            width: 100%;

            border-radius: 10px;

            overflow: hidden;

            border: 2px solid #444;

            background: #8b5a2b;
        }

        .string {
            display: grid;

            grid-template-columns:
                38px
                repeat(5, 1fr);

            height: 56px;

            border-bottom:
                1px solid rgba(255,255,255,0.28);
        }

        .string:last-child {
            border-bottom: none;
        }


        /* ---------------- STRING LABEL ---------------- */

        .string-label {
            display: flex;

            align-items: center;
            justify-content: center;

            background: #303030;

            font-size: 14px;
            font-weight: 600;

            border-right: 2px solid #555;
        }


        /* ---------------- FRET ---------------- */

        .fret {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            border-right:
                2px solid rgba(255,255,255,0.45);
        }

        .fret:last-child {
            border-right: none;
        }


        /* ---------------- NOTES ---------------- */

        .note {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: 700;

            z-index: 2;
        }

        .scale-note {
            background: #f1f1f1;
            color: #111;
        }

        .root-note {
            background: #e63946;
            color: white;
        }


        /* ---------------- FRET NUMBERS ---------------- */

        .fret-number {
            position: absolute;

            bottom: 2px;
            right: 4px;

            font-size: 9px;

            color: rgba(255,255,255,0.5);
        }


        /* ---------------- LEGEND ---------------- */

        .legend {
            display: flex;

            justify-content: center;

            gap: 20px;

            margin-top: 12px;

            font-size: 13px;

            color: #999;
        }

        .legend-item {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .legend-dot {
            width: 13px;
            height: 13px;

            border-radius: 50%;
        }

        .root-dot {
            background: #e63946;
        }

        .scale-dot {
            background: #f1f1f1;
        }


        /* ---------------- POSITION DOTS ---------------- */

        .position-dots {
            display: flex;

            justify-content: center;

            gap: 7px;

            margin-top: 4px;
        }

        .position-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #444;
        }

        .position-dot.active {
            background: #eee;
        }


        /* ---------------- DESKTOP ---------------- */

        @media (min-width: 700px) {

            .fretboard-wrapper {
                max-width: 700px;
                margin: auto;
            }

            .string {
                height: 65px;
            }

            .note {
                width: 42px;
                height: 42px;

                font-size: 14px;
            }

            .controls {
                padding-left: 20px;
                padding-right: 20px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>Scale Visualizer</h1>

    <div class="subtitle">
        Guitar • Scales • Notes
    </div>

</header>



<!-- ================= CONTROLS ================= -->

<div class="controls">

    <select id="rootSelect">

        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>

    </select>


    <select id="scaleSelect">

        <optgroup label="Diatonic">

            <option value="major">
                Major / Ionian
            </option>

            <option value="minor">
                Natural Minor / Aeolian
            </option>

            <option value="dorian">
                Dorian
            </option>

            <option value="phrygian">
                Phrygian
            </option>

            <option value="lydian">
                Lydian
            </option>

            <option value="mixolydian">
                Mixolydian
            </option>

            <option value="locrian">
                Locrian
            </option>

        </optgroup>


        <optgroup label="Minor">

            <option value="harmonicMinor">
                Harmonic Minor
            </option>

            <option value="melodicMinor">
                Melodic Minor
            </option>

        </optgroup>


        <optgroup label="Pentatonic & Blues">

            <option value="majorPentatonic">
                Major Pentatonic
            </option>

            <option value="minorPentatonic">
                Minor Pentatonic
            </option>

            <option value="blues">
                Blues
            </option>

        </optgroup>

    </select>

</div>



<!-- ================= SCALE INFORMATION ================= -->

<div class="scale-info">

    <div
        class="scale-name"
        id="scaleName"
    >
        C Major / Ionian
    </div>

    <div
        class="notes"
        id="notes"
    ></div>

</div>



<!-- ================= POSITION NAVIGATION ================= -->

<div class="position-header">

    <button
        class="position-button"
        id="previousButton"
        aria-label="Previous position"
    >
        ‹
    </button>


    <div class="position-title">

        <div
            class="position-number"
            id="positionNumber"
        >
            Position 1 / 5
        </div>

        <div
            class="position-frets"
            id="positionFrets"
        >
            Frets 1 – 5
        </div>

        <div
            class="position-dots"
            id="positionDots"
        ></div>

    </div>


    <button
        class="position-button"
        id="nextButton"
        aria-label="Next position"
    >
        ›
    </button>

</div>



<!-- ================= FRETBOARD ================= -->

<div
    class="fretboard-wrapper"
    id="fretboardWrapper"
>

    <div
        class="fretboard"
        id="fretboard"
    ></div>


    <div class="legend">

        <div class="legend-item">

            <div class="legend-dot root-dot"></div>

            Root

        </div>


        <div class="legend-item">

            <div class="legend-dot scale-dot"></div>

            Scale note

        </div>

    </div>

</div>



<script>


/* =====================================================
   MUSICAL DATA
   ===================================================== */


const noteNames = [

    "C",
    "C#",
    "D",
    "D#",
    "E",
    "F",
    "F#",
    "G",
    "G#",
    "A",
    "A#",
    "B"

];


const scales = {


    major: {

        name: "Major / Ionian",

        intervals: [
            0, 2, 4, 5, 7, 9, 11
        ]

    },


    minor: {

        name: "Natural Minor / Aeolian",

        intervals: [
            0, 2, 3, 5, 7, 8, 10
        ]

    },


    dorian: {

        name: "Dorian",

        intervals: [
            0, 2, 3, 5, 7, 9, 10
        ]

    },


    phrygian: {

        name: "Phrygian",

        intervals: [
            0, 1, 3, 5, 7, 8, 10
        ]

    },


    lydian: {

        name: "Lydian",

        intervals: [
            0, 2, 4, 6, 7, 9, 11
        ]

    },


    mixolydian: {

        name: "Mixolydian",

        intervals: [
            0, 2, 4, 5, 7, 9, 10
        ]

    },


    locrian: {

        name: "Locrian",

        intervals: [
            0, 1, 3, 5, 6, 8, 10
        ]

    },


    harmonicMinor: {

        name: "Harmonic Minor",

        intervals: [
            0, 2, 3, 5, 7, 8, 11
        ]

    },


    melodicMinor: {

        name: "Melodic Minor",

        intervals: [
            0, 2, 3, 5, 7, 9, 11
        ]

    },


    majorPentatonic: {

        name: "Major Pentatonic",

        intervals: [
            0, 2, 4, 7, 9
        ]

    },


    minorPentatonic: {

        name: "Minor Pentatonic",

        intervals: [
            0, 3, 5, 7, 10
        ]

    },


    blues: {

        name: "Blues",

        intervals: [
            0, 3, 5, 6, 7, 10
        ]

    }

};



/* =====================================================
   GUITAR
   ===================================================== */


const tuning = [

    "E",
    "A",
    "D",
    "G",
    "B",
    "E"

];



/*
    Five study positions.

    Each position contains five frets.

    They overlap by one fret so moving
    between positions doesn't create a
    completely disconnected picture.
*/


const positions = [

    {
        start: 1,
        end: 5
    },

    {
        start: 4,
        end: 8
    },

    {
        start: 7,
        end: 11
    },

    {
        start: 10,
        end: 14
    },

    {
        start: 13,
        end: 17
    }

];



/* =====================================================
   STATE
   ===================================================== */


let currentPosition = 0;



const rootSelect =
    document.getElementById("rootSelect");


const scaleSelect =
    document.getElementById("scaleSelect");


const fretboard =
    document.getElementById("fretboard");


const scaleName =
    document.getElementById("scaleName");


const notes =
    document.getElementById("notes");


const positionNumber =
    document.getElementById("positionNumber");


const positionFrets =
    document.getElementById("positionFrets");


const positionDots =
    document.getElementById("positionDots");


const previousButton =
    document.getElementById("previousButton");


const nextButton =
    document.getElementById("nextButton");


const fretboardWrapper =
    document.getElementById("fretboardWrapper");



/* =====================================================
   GET SCALE NOTES
   ===================================================== */


function getScaleNotes() {


    const root =
        rootSelect.value;


    const rootIndex =
        noteNames.indexOf(root);


    const intervals =
        scales[
            scaleSelect.value
        ].intervals;


    return intervals.map(

        interval =>

            noteNames[
                (rootIndex + interval) % 12
            ]

    );

}



/* =====================================================
   DRAW FRETBOARD
   ===================================================== */


function drawFretboard() {


    const root =
        rootSelect.value;


    const scaleNotes =
        getScaleNotes();


    const position =
        positions[currentPosition];


    fretboard.innerHTML = "";



    tuning.forEach(

        openNote => {


            const string =
                document.createElement("div");


            string.className =
                "string";



            const label =
                document.createElement("div");


            label.className =
                "string-label";


            label.textContent =
                openNote;


            string.appendChild(label);



            const openIndex =
                noteNames.indexOf(openNote);



            for (
                let fret = position.start;
                fret <= position.end;
                fret++
            ) {


                const fretElement =
                    document.createElement("div");


                fretElement.className =
                    "fret";



                const note =
                    noteNames[
                        (openIndex + fret) % 12
                    ];



                if (
                    scaleNotes.includes(note)
                ) {


                    const noteElement =
                        document.createElement("div");


                    noteElement.className =
                        "note " +

                        (
                            note === root

                            ? "root-note"

                            : "scale-note"
                        );


                    noteElement.textContent =
                        note;


                    fretElement.appendChild(
                        noteElement
                    );

                }



                const number =
                    document.createElement("div");


                number.className =
                    "fret-number";


                number.textContent =
                    fret;


                fretElement.appendChild(
                    number
                );


                string.appendChild(
                    fretElement
                );

            }



            fretboard.appendChild(
                string
            );

        }

    );

}



/* =====================================================
   UPDATE POSITION UI
   ===================================================== */


function updatePositionUI() {


    const position =
        positions[currentPosition];


    positionNumber.textContent =

        `Position ${currentPosition + 1} / ${positions.length}`;



    positionFrets.textContent =

        `Frets ${position.start} – ${position.end}`;



    positionDots.innerHTML = "";



    positions.forEach(

        (_, index) => {


            const dot =
                document.createElement("div");


            dot.className =
                "position-dot";


            if (
                index === currentPosition
            ) {

                dot.classList.add("active");

            }


            positionDots.appendChild(
                dot
            );

        }

    );

}



/* =====================================================
   UPDATE EVERYTHING
   ===================================================== */


function updateApp() {


    const root =
        rootSelect.value;


    const scale =
        scales[
            scaleSelect.value
        ];


    const scaleNotes =
        getScaleNotes();



    scaleName.textContent =

        `${root} ${scale.name}`;



    notes.textContent =

        scaleNotes.join("  •  ");



    drawFretboard();


    updatePositionUI();

}



/* =====================================================
   NAVIGATION
   ===================================================== */


function nextPosition() {


    if (
        currentPosition <
        positions.length - 1
    ) {

        currentPosition++;

        updateApp();

    }

}



function previousPosition() {


    if (
        currentPosition > 0
    ) {

        currentPosition--;

        updateApp();

    }

}



nextButton.addEventListener(
    "click",
    nextPosition
);


previousButton.addEventListener(
    "click",
    previousPosition
);



/* =====================================================
   SELECTORS
   ===================================================== */


rootSelect.addEventListener(

    "change",

    () => {

        currentPosition = 0;

        updateApp();

    }

);


scaleSelect.addEventListener(

    "change",

    () => {

        currentPosition = 0;

        updateApp();

    }

);



/* =====================================================
   SWIPE
   ===================================================== */


let touchStartX = 0;

let touchEndX = 0;



fretboardWrapper.addEventListener(

    "touchstart",

    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },

    {
        passive: true
    }

);



fretboardWrapper.addEventListener(

    "touchend",

    event => {

        touchEndX =
            event.changedTouches[0].screenX;


        handleSwipe();

    },

    {
        passive: true
    }

);



function handleSwipe() {


    const difference =
        touchEndX - touchStartX;


    const minimumSwipe =
        50;



    if (
        Math.abs(difference)
        < minimumSwipe
    ) {

        return;

    }



    if (
        difference < 0
    ) {

        nextPosition();

    } else {

        previousPosition();

    }

}



/* =====================================================
   START
   ===================================================== */


updateApp();


</script>


</body>

</html>

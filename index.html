<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>ProjectVoul — Guitar Scales</title>

<style>
:root {
    --bg: #111111;
    --panel: #222222;
    --panel-2: #1c1c1c;
    --border: #3c3c3c;
    --text: #f2f2f2;
    --muted: #999999;
    --muted-2: #777777;

    --wood: #99652d;
    --wood-line: #c08b4e;

    --note: #f4f4f4;
    --root: #f2384f;

    --header-height: 52px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
select {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 22px 28px;
}

/* =========================
   HEADER
========================= */

.brand {
    text-align: center;
    padding: 26px 0 20px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
}

.brand span {
    margin: 0 5px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 12px;
    margin-bottom: 18px;
}

.root-select,
.scale-button {
    height: 66px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--panel);
    color: var(--text);
}

.root-select {
    width: 100%;
    padding: 0 24px;
    font-size: 25px;
    appearance: none;
    text-align: left;
    cursor: pointer;
}

.scale-button {
    width: 100%;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-size: 21px;
}

.scale-button .arrow {
    color: var(--muted);
    font-size: 13px;
}

/* =========================
   SCALE MENU
========================= */

.scale-menu {
    position: relative;
    z-index: 20;
}

.menu-panel {
    display: none;
    position: absolute;
    top: 74px;
    left: 0;
    width: 100%;
    background: var(--panel-2);
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
}

.menu-panel.open {
    display: block;
}

.category {
    border-bottom: 1px solid #333;
}

.category:last-child {
    border-bottom: none;
}

.category-header {
    height: 68px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    color: #aaa;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;

    cursor: pointer;
}

.category-header .chevron {
    font-size: 13px;
    color: #777;
    transition: transform .18s ease;
}

.category.open .category-header .chevron {
    transform: rotate(90deg);
}

.category-items {
    display: none;
    padding: 0 16px 12px;
}

.category.open .category-items {
    display: block;
}

.scale-item {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: #eee;
    text-align: left;
    padding: 12px 18px;
    font-size: 17px;
    cursor: pointer;
}

.scale-item:hover {
    background: #292929;
}

.scale-item.active {
    background: #f1f1f1;
    color: #171717;
}

/* =========================
   DISPLAY MODE
========================= */

.display-label {
    text-align: center;
    margin-top: 4px;
    margin-bottom: 8px;

    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1.5px;
}

.display-switch {
    width: 440px;
    max-width: 100%;
    height: 64px;
    margin: 0 auto 22px;

    padding: 5px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--panel);
}

.display-switch button {
    border: 0;
    border-radius: 15px;
    background: transparent;

    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
}

.display-switch button.active {
    background: #f1f1f1;
    color: #171717;
}

/* =========================
   SCALE INFO
========================= */

.scale-info {
    text-align: center;
    margin-bottom: 17px;
}

.scale-name {
    margin: 0;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.08;
    font-weight: 700;
}

.scale-notes {
    margin-top: 14px;
    color: var(--muted);
    font-size: clamp(17px, 3vw, 24px);
    letter-spacing: 2px;
}

/* =========================
   POSITION
========================= */

.position-area {
    display: grid;
    grid-template-columns: 88px 1fr 88px;
    align-items: center;
    margin-bottom: 18px;
}

.position-button {
    width: 88px;
    height: 88px;

    border-radius: 50%;
    border: 2px solid var(--border);

    background: var(--panel);
    color: white;

    font-size: 40px;
    line-height: 1;

    cursor: pointer;
}

.position-button:active {
    transform: scale(.96);
}

.position-info {
    text-align: center;
}

.position-title {
    font-size: 25px;
    font-weight: 700;
}

.position-frets {
    margin-top: 7px;
    color: var(--muted);
    font-size: 17px;
}

.position-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 13px;
}

.position-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #444;
}

.position-dot.active {
    background: #eee;
}

/* =========================
   FRETBOARD
========================= */

.fretboard-wrap {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 3px;
}

.fretboard {
    display: grid;
    grid-template-columns: 80px repeat(5, 1fr);

    border: 5px solid #303030;
    border-radius: 20px;
    overflow: hidden;

    background: var(--wood);
}

.string-label {
    min-height: 112px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #303030;

    font-size: 25px;
    font-weight: 600;
}

.fret {
    position: relative;
    min-height: 112px;

    border-left: 3px solid var(--wood-line);
    border-bottom: 2px solid var(--wood-line);
}

.fret:nth-last-child(-n+6) {
    border-bottom: none;
}

.fret-number {
    position: absolute;
    right: 8px;
    bottom: 5px;

    color: rgba(255,255,255,.55);
    font-size: 14px;
}

.note {
    position: absolute;

    width: 66px;
    height: 66px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: var(--note);
    color: #151515;

    font-size: 18px;
    font-weight: 700;

    line-height: 1.05;

    user-select: none;
}

.note .interval {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 700;
}

.note.root {
    background: var(--root);
    color: white;
}

.note.root .interval {
    color: white;
}

/* =========================
   LEGEND
========================= */

.legend {
    display: flex;
    justify-content: center;
    gap: 28px;

    margin-top: 17px;

    color: var(--muted);
    font-size: 17px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
}

.legend-dot {
    width: 17px;
    height: 17px;
    border-radius: 50%;
}

.legend-dot.root {
    background: var(--root);
}

.legend-dot.note {
    position: static;
    width: 17px;
    height: 17px;
    transform: none;
    background: var(--note);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .app {
        padding: 0 22px 25px;
    }

    .brand {
        padding-top: 22px;
        padding-bottom: 15px;
    }

    .controls {
        grid-template-columns: 200px 1fr;
        gap: 10px;
    }

    .root-select,
    .scale-button {
        height: 64px;
    }

    .root-select {
        font-size: 23px;
    }

    .scale-button {
        font-size: 18px;
    }

    .display-switch {
        height: 61px;
        margin-bottom: 18px;
    }

    .display-switch button {
        font-size: 16px;
    }

    .scale-name {
        font-size: 34px;
    }

    .scale-notes {
        font-size: 18px;
        letter-spacing: 1.5px;
    }

    .position-area {
        grid-template-columns: 72px 1fr 72px;
    }

    .position-button {
        width: 72px;
        height: 72px;
        font-size: 34px;
    }

    .position-title {
        font-size: 23px;
    }

    .position-frets {
        font-size: 15px;
    }

    .fretboard {
        grid-template-columns: 78px repeat(5, minmax(74px, 1fr));
    }

    .string-label {
        min-height: 106px;
        font-size: 23px;
    }

    .fret {
        min-height: 106px;
    }

    .note {
        width: 62px;
        height: 62px;
        font-size: 17px;
    }

    .note .interval {
        font-size: 13px;
    }

    .legend {
        font-size: 16px;
        gap: 22px;
    }
}

@media (max-width: 430px) {

    .app {
        padding-left: 20px;
        padding-right: 20px;
    }

    .controls {
        grid-template-columns: 88px 1fr;
    }

    .root-select {
        padding: 0 16px;
        text-align: center;
    }

    .scale-button {
        padding: 0 17px;
    }

    .fretboard {
        grid-template-columns: 70px repeat(5, 73px);
    }
}
</style>
</head>

    document.getElementById("positionTitle");

const positionFrets =
    document.getElementById("positionFrets");

const positionDots =
    document.getElementById("positionDots");

const prevPosition =
    document.getElementById("prevPosition");

const nextPosition =
    document.getElementById("nextPosition");


/* =========================================================
   MUSICAL SPELLING
========================================================= */

const letterOrder = [
    "C",
    "D",
    "E",
    "F",
    "G",
    "A",
    "B"
];

const naturalPitch = {
    C: 0,
    D: 2,
    E: 4,
    F: 5,
    G: 7,
    A: 9,
    B: 11
};

function getRootLetter(root) {
    return root[0];
}


/*
   Creates the correctly spelled note for a scale degree.

   Example:
   C melodic minor:
   C D Eb F G A B

   rather than:
   C D D# F G A B
*/

function spellNote(root, semitones, degreeIndex) {

    const rootLetter =
        getRootLetter(root);

    const rootLetterIndex =
        letterOrder.indexOf(rootLetter);

    const targetLetter =
        letterOrder[
            (rootLetterIndex + degreeIndex) %
            letterOrder.length
        ];

    const targetPitch =
        (
            pitchClass[root] +
            semitones
        ) % 12;

    let diff =
        targetPitch -
        naturalPitch[targetLetter];

    diff = ((diff + 6) % 12) - 6;

    let accidental = "";

    if (diff === 1) accidental = "#";
    if (diff === 2) accidental = "##";
    if (diff === -1) accidental = "b";
    if (diff === -2) accidental = "bb";

    return targetLetter + accidental;
}


function getScaleNotes() {

    const scale =
        scales[currentScale];

    return scale.intervals.map(
        (interval, index) =>
            spellNote(
                currentRoot,
                interval,
                index
            )
    );
}


/* =========================================================
   INTERVAL NAMES
========================================================= */

const intervalNames = {
    0: "R",
    1: "m2",
    2: "M2",
    3: "m3",
    4: "M3",
    5: "P4",
    6: "TT",
    7: "P5",
    8: "m6",
    9: "M6",
    10: "m7",
    11: "M7"
};

function getIntervalName(semitones) {

    return intervalNames[
        semitones % 12
    ] || "";
}


/* =========================================================
   NOTE DISPLAY
========================================================= */

function createNoteElement(
    noteName,
    interval,
    isRoot
) {

    const note =
        document.createElement("div");

    note.className =
        "note" +
        (isRoot ? " root" : "");

    const name =
        document.createElement("div");

    name.textContent =
        noteName;

    const intervalElement =
        document.createElement("div");

    intervalElement.className =
        "interval";

    intervalElement.textContent =
        getIntervalName(interval);

    if (displayMode === "notes") {
        intervalElement.style.display =
            "none";
    }

    if (displayMode === "intervals") {
        name.style.display =
            "none";
    }

    note.appendChild(name);
    note.appendChild(intervalElement);

    return note;
}


/* =========================================================
   RENDER SCALE INFO
========================================================= */

function renderScaleInfo() {

    const scale =
        scales[currentScale];

    const notes =
        getScaleNotes();

    scaleName.textContent =
        currentRoot + " " + scale.name;

    scaleNotes.textContent =
        notes.join(" · ");

    selectedScale.textContent =
        scale.name;
}


/* =========================================================
   RENDER POSITION
========================================================= */

function renderPositionInfo() {

    const position =
        positions[currentPosition];

    positionTitle.textContent =
        `Position ${currentPosition + 1} / ${positions.length}`;

    positionFrets.textContent =
        `Frets ${position.start} – ${position.end}`;

    positionDots.innerHTML = "";

    positions.forEach(
        (_, index) => {

            const dot =
                document.createElement("div");

            dot.className =
                "position-dot" +
                (
                    index === currentPosition
                    ? " active"
                    : ""
                );

            positionDots.appendChild(dot);
        }
    );
}


/* =========================================================
   RENDER FRETBOARD
========================================================= */

function renderFretboard() {

    fretboard.innerHTML = "";

    const scale =
        scales[currentScale];

    const intervals =
        scale.intervals;

    const notes =
        getScaleNotes();

    const position =
        positions[currentPosition];


    strings.forEach(
        string => {

            const label =
                document.createElement("div");

            label.className =
                "string-label";

            label.textContent =
                string.name;

            fretboard.appendChild(label);


            for (
                let fret = position.start;
                fret <= position.end;
                fret++
            ) {

                const cell =
                    document.createElement("div");

                cell.className =
                    "fret";


                const fretNumber =
                    document.createElement("div");

                fretNumber.className =
                    "fret-number";

                fretNumber.textContent =
                    fret;

                cell.appendChild(
                    fretNumber
                );


                /*
                   Open string is fret 0.
                   Since our positions start at fret 1,
                   all displayed cells are fretted notes.
                */

                const pitch =
                    (
                        string.pitch +
                        fret
                    ) % 12;


                const interval =
                    (
                        pitch -
                        pitchClass[currentRoot] +
                        12
                    ) % 12;


                const intervalIndex =
                    intervals.indexOf(interval);


                if (intervalIndex !== -1) {

                    const noteName =
                        notes[intervalIndex];

                    const isRoot =
                        interval === 0;

                    const noteElement =
                        createNoteElement(
                            noteName,
                            interval,
                            isRoot
                        );

                    cell.appendChild(
                        noteElement
                    );
                }


                fretboard.appendChild(cell);
            }
        }
    );
}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function render() {

    renderScaleInfo();

    renderPositionInfo();

    renderFretboard();
}


/* =========================================================
   ROOT CHANGE
========================================================= */

rootSelect.addEventListener(
    "change",
    () => {

        currentRoot =
            rootSelect.value;

        render();
    }
);


/* =========================================================
   SCALE MENU OPEN / CLOSE
========================================================= */

scaleButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        menuPanel.classList.toggle(
            "open"
        );
    }
);


document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(
                ".scale-menu"
            )
        ) {
            menuPanel.classList.remove(
                "open"
            );
        }
    }
);


/* =========================================================
   CATEGORY ACCORDIONS
========================================================= */

document
    .querySelectorAll(".category-header")
    .forEach(
        header => {

            header.addEventListener(
                "click",
                () => {

                    const category =
                        header.parentElement;

                    category.classList.toggle(
                        "open"
                    );
                }
            );
        }
    );


/* =========================================================
   SCALE SELECTION
========================================================= */

document
    .querySelectorAll(".scale-item")
    .forEach(
        item => {

            item.addEventListener(
                "click",
                () => {

                    currentScale =
                        item.dataset.scale;

                    currentPosition = 0;

                    document
                        .querySelectorAll(
                            ".scale-item"
                        )
                        .forEach(
                            other =>
                                other.classList.remove(
                                    "active"
                                )
                        );

                    /*
                       The same scale appears in more
                       than one category, so activate
                       every matching button.
                    */

                    document
                        .querySelectorAll(
                            `[data-scale="${currentScale}"]`
                        )
                        .forEach(
                            matching =>
                                matching.classList.add(
                                    "active"
                                )
                        );

                    menuPanel.classList.remove(
                        "open"
                    );

                    render();
                }
            );
        }
    );


/* =========================================================
   DISPLAY MODE
========================================================= */

document
    .querySelectorAll(
        ".display-switch button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    displayMode =
                        button.dataset.display;

                    document
                        .querySelectorAll(
                            ".display-switch button"
                        )
                        .forEach(
                            other =>
                                other.classList.remove(
                                    "active"
                                )
                        );

                    button.classList.add(
                        "active"
                    );

                    renderFretboard();
                }
            );
        }
    );


/* =========================================================
   POSITION NAVIGATION
========================================================= */

prevPosition.addEventListener(
    "click",
    () => {

        currentPosition--;

        if (
            currentPosition < 0
        ) {
            currentPosition =
                positions.length - 1;
        }

        render();
    }
);


nextPosition.addEventListener(
    "click",
    () => {

        currentPosition++;

        if (
            currentPosition >=
            positions.length
        ) {
            currentPosition = 0;
        }

        render();
    }
);


/* =========================================================
   INITIAL RENDER
========================================================= */

render();

</script>

</body>
</html>

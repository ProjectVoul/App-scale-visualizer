<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ProjectVoul — Guitar Scales</title>

<style>

/* =========================================================
   PROJECTVOUL — BASE
========================================================= */

:root {
    --bg: #111111;
    --panel: #222222;
    --panel-dark: #1b1b1b;

    --border: #3c3c3c;

    --text: #f2f2f2;
    --muted: #999999;
    --muted-dark: #707070;

    --wood: #99652d;
    --wood-line: #c08b4e;

    --note: #f4f4f4;
    --root: #f2384f;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overflow-x: hidden;
}

button,
select {
    font: inherit;
}

button {
    -webkit-appearance: none;
}


/* =========================================================
   MAIN APP
========================================================= */

.app {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    padding:
        0
        22px
        30px;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
    text-align: center;

    padding:
        22px
        0
        17px;

    color: var(--muted);

    font-size: 14px;
    letter-spacing: 1px;
}

.brand span {
    margin: 0 5px;
}


/* =========================================================
   TOP CONTROLS
========================================================= */

.controls {
    position: relative;
    z-index: 50;

    display: grid;

    grid-template-columns:
        88px
        minmax(0, 1fr);

    gap: 10px;

    margin-bottom: 16px;
}

.root-select,
.scale-button {
    height: 62px;

    border:
        2px solid
        var(--border);

    border-radius: 19px;

    background:
        var(--panel);

    color:
        var(--text);
}

.root-select {
    width: 100%;

    padding: 0 12px;

    font-size: 22px;

    text-align: center;

    cursor: pointer;

    appearance: none;
}

.scale-menu {
    position: relative;
    min-width: 0;
}

.scale-button {
    width: 100%;

    padding:
        0
        17px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    cursor: pointer;

    font-size: 18px;

    overflow: hidden;
}

.scale-button span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.scale-button .arrow {
    flex-shrink: 0;

    margin-left: 10px;

    color: var(--muted);

    font-size: 12px;
}


/* =========================================================
   SCALE MENU
========================================================= */

.menu-panel {
    display: none;

    position: absolute;

    top: 70px;
    left: 0;

    width: 100%;

    background:
        var(--panel-dark);

    border:
        2px solid
        var(--border);

    border-radius: 21px;

    overflow: hidden;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.5);
}

.menu-panel.open {
    display: block;
}

.category {
    border-bottom:
        1px solid #333;
}

.category:last-child {
    border-bottom: none;
}

.category-header {
    height: 64px;

    padding:
        0
        28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    color: #aaa;

    font-size: 16px;
    font-weight: 700;

    letter-spacing: 1px;

    cursor: pointer;
}

.category-header .chevron {
    color: #777;

    font-size: 18px;

    transition:
        transform .18s ease;
}

.category.open
.category-header
.chevron {
    transform:
        rotate(90deg);
}

.category-items {
    display: none;

    padding:
        0
        15px
        12px;
}

.category.open
.category-items {
    display: block;
}

.scale-item {
    width: 100%;

    min-height: 52px;

    padding:
        10px
        18px;

    border: 0;
    border-radius: 13px;

    background: transparent;

    color: #eee;

    text-align: left;

    font-size: 17px;

    cursor: pointer;
}

.scale-item:active {
    background: #2b2b2b;
}

.scale-item.active {
    background: #f1f1f1;
    color: #171717;
}


/* =========================================================
   DISPLAY
========================================================= */

.display-label {
    text-align: center;

    margin:
        4px
        0
        7px;

    color: var(--muted);

    font-size: 12px;

    letter-spacing: 1.5px;
}

.display-switch {
    width: 100%;
    max-width: 440px;

    height: 59px;

    margin:
        0
        auto
        18px;

    padding: 4px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    border:
        2px solid
        var(--border);

    border-radius: 19px;

    background: var(--panel);
}

.display-switch button {
    border: 0;

    border-radius: 14px;

    background: transparent;

    color: var(--muted);

    font-size: 16px;

    cursor: pointer;
}

.display-switch button.active {
    background: #f1f1f1;
    color: #171717;
}


/* =========================================================
   SCALE INFORMATION
========================================================= */

.scale-info {
    text-align: center;

    margin-bottom: 14px;
}

.scale-name {
    margin: 0;

    font-size:
        clamp(29px, 5vw, 42px);

    line-height: 1.08;

    font-weight: 700;
}

.scale-notes {
    margin-top: 11px;

    color: var(--muted);

    font-size:
        clamp(16px, 3vw, 23px);

    letter-spacing: 1.5px;

    white-space: nowrap;
}


/* =========================================================
   POSITION NAVIGATION
========================================================= */

.position-area {
    display: grid;

    grid-template-columns:
        72px
        minmax(0, 1fr)
        72px;

    align-items: center;

    margin-bottom: 14px;
}

.position-button {
    width: 72px;
    height: 72px;

    border:
        2px solid
        var(--border);

    border-radius: 50%;

    background: var(--panel);

    color: white;

    font-size: 35px;

    line-height: 1;

    cursor: pointer;
}

.position-button:active {
    transform: scale(.96);
}

.position-info {
    text-align: center;
}

.position-title {
    font-size: 23px;
    font-weight: 700;
}

.position-frets {
    margin-top: 5px;

    color: var(--muted);

    font-size: 15px;
}

.position-dots {
    display: flex;

    justify-content: center;

    gap: 9px;

    margin-top: 10px;
}

.position-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #444;
}

.position-dot.active {
    background: #eee;
}


/* =========================================================
   FRETBOARD CONTAINER

   IMPORTANT:
   The fretboard ALWAYS fits the available width.
   There is NO horizontal scrolling.
========================================================= */

.fretboard-wrap {
    width: 100%;

    overflow: hidden;
}

.fretboard {
    width: 100%;
    max-width: 100%;

    display: grid;

    /*
       58px for string names,
       remaining width divided equally
       between the five frets.
    */
    grid-template-columns:
        58px
        repeat(5, minmax(0, 1fr));

    border:
        4px solid
        #303030;

    border-radius: 19px;

    overflow: hidden;

    background:
        var(--wood);
}


/* =========================================================
   STRING LABELS
========================================================= */

.string-label {
    min-width: 0;

    height: 92px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        #303030;

    color: #f3f3f3;

    font-size: 21px;
    font-weight: 600;

    border-bottom:
        2px solid
        var(--wood-line);
}


/* =========================================================
   FRET CELLS
========================================================= */

.fret {
    position: relative;

    min-width: 0;

    height: 92px;

    border-left:
        3px solid
        var(--wood-line);

    border-bottom:
        2px solid
        var(--wood-line);
}


/*
   Remove bottom border from
   the final row.
*/

.fretboard > :nth-last-child(-n+6) {
    border-bottom: none;
}


/* =========================================================
   FRET NUMBERS
========================================================= */

.fret-number {
    position: absolute;

    right: 5px;
    bottom: 4px;

    color:
        rgba(255,255,255,.52);

    font-size: 12px;

    pointer-events: none;
}


/* =========================================================
   NOTE CIRCLES
========================================================= */

.note {
    position: absolute;

    width: 54px;
    height: 54px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    background:
        var(--note);

    color: #151515;

    font-size: 16px;

    font-weight: 700;

    line-height: 1.0;

    user-select: none;

    pointer-events: none;
}

.note .interval {
    margin-top: 3px;

    font-size: 12px;

    font-weight: 700;
}

.note.root {
    background:
        var(--root);

    color: white;
}


/* =========================================================
   LEGEND
========================================================= */

.legend {
    display: flex;

    justify-content: center;

    gap: 23px;

    margin-top: 14px;

    color: var(--muted);

    font-size: 16px;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 8px;
}

.legend-dot {
    width: 17px;
    height: 17px;

    border-radius: 50%;
}

.legend-dot.root {
    background: var(--root);
}

.legend-dot.note {
    background: var(--note);
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (
    orientation: landscape
) and (
    max-height: 600px
) {

    .app {
        max-width: 1100px;

        padding:
            0
            24px
            18px;
    }

    .brand {
        padding:
            10px
            0
            8px;
    }

    .controls {
        margin-bottom: 9px;
    }

    .root-select,
    .scale-button {
        height: 50px;
    }

    .menu-panel {
        top: 57px;
    }

    .display-label {
        display: none;
    }

    .display-switch {
        height: 48px;

        margin-bottom: 9px;
    }

    .display-switch button {
        font-size: 14px;
    }

    .scale-info {
        margin-bottom: 8px;
    }

    .scale-name {
        font-size: 28px;
    }

    .scale-notes {
        margin-top: 5px;
        font-size: 16px;
    }

    .position-area {
        grid-template-columns:
            58px
            minmax(0,1fr)
            58px;

        margin-bottom: 8px;
    }

    .position-button {
        width: 58px;
        height: 58px;

        font-size: 30px;
    }

    .position-title {
        font-size: 19px;
    }

    .position-frets {
        margin-top: 2px;
        font-size: 13px;
    }

    .position-dots {
        margin-top: 6px;
    }

    .fretboard {
        grid-template-columns:
            54px
            repeat(5, minmax(0, 1fr));

        border-width: 3px;
        border-radius: 15px;
    }

    .string-label,
    .fret {
        height: 68px;
    }

    .string-label {
        font-size: 18px;
    }

    .note {
        width: 45px;
        height: 45px;

        font-size: 14px;
    }

    .note .interval {
        font-size: 10px;
        margin-top: 2px;
    }

    .fret-number {
        right: 4px;
        bottom: 3px;
        font-size: 10px;
    }

    .legend {
        margin-top: 8px;
        font-size: 14px;
    }

    .legend-dot {
        width: 14px;
        height: 14px;
    }
}


/* =========================================================
   VERY SMALL PORTRAIT PHONES
========================================================= */

@media (
    orientation: portrait
) and (
    max-width: 360px
) {

    .app {
        padding-left: 16px;
        padding-right: 16px;
    }

    .controls {
        grid-template-columns:
            76px
            minmax(0,1fr);
    }

    .scale-button {
        padding-left: 14px;
        padding-right: 14px;

        font-size: 16px;
    }

    .fretboard {
        grid-template-columns:
            50px
            repeat(5, minmax(0,1fr));
    }

    .string-label {
        height: 84px;
        font-size: 19px;
    }

    .fret {
        height: 84px;
    }

    .note {
        width: 48px;
        height: 48px;

        font-size: 14px;
    }

    .note .interval {
        font-size: 10px;
    }

    .scale-notes {
        font-size: 15px;
        letter-spacing: 1px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         BRAND
    ====================================================== -->

    <div class="brand">
        Guitar
        <span>•</span>
        Scales
        <span>•</span>

    </div>


    <!-- =====================================================

    ====================================================== -->

    <div class="controls">

        <select

            <option value="F">F</option>

            <option value="Gb">Gb</option>

            <option value="G">G</option>

        <div class="scale-menu">

            <div

                <div class="category">

                    </div>


                    <div class="category-items">

                <div class="category">

    </div>


    <!-- =====================================================
         DISPLAY

<script>

/* =========================================================
   CHROMATIC / PITCH DATA
========================================================= */

const pitchClass = {

    C: 0,

    "C#": 1,
    Db: 1,

    D: 2,

    "D#": 3,
    Eb: 3,

    E: 4,

    F: 5,

    "F#": 6,
    Gb: 6,

    G: 7,

    "G#": 8,
    Ab: 8,

    A: 9,

    "A#": 10,
    Bb: 10,

    B: 11
};


/* =========================================================
   MUSICAL LETTERS
========================================================= */

const letterOrder = [
    "C",
    "D",
    "E",
    "F",
    "G",
    "A",
    "B"
];

const naturalPitch = {

    C: 0,
    D: 2,
    E: 4,
    F: 5,
    G: 7,
    A: 9,
    B: 11

};


/* =========================================================
   SCALE DEFINITIONS

   Semitone distances from root.
========================================================= */

const scales = {

    major: {
        name: "Major / Ionian",
        intervals: [0,2,4,5,7,9,11]
    },

    dorian: {
        name: "Dorian",
        intervals: [0,2,3,5,7,9,10]
    },

    phrygian: {
        name: "Phrygian",
        intervals: [0,1,3,5,7,8,10]
    },

    lydian: {
        name: "Lydian",
        intervals: [0,2,4,6,7,9,11]
    },

    mixolydian: {
        name: "Mixolydian",
        intervals: [0,2,4,5,7,9,10]
    },

    naturalMinor: {
        name: "Natural Minor / Aeolian",
        intervals: [0,2,3,5,7,8,10]
    },

    locrian: {
        name: "Locrian",
        intervals: [0,1,3,5,6,8,10]
    },


    harmonicMinor: {
        name: "Harmonic Minor",
        intervals: [0,2,3,5,7,8,11]
    },

    melodicMinor: {
        name: "Melodic Minor",
        intervals: [0,2,3,5,7,9,11]
    },


    majorPentatonic: {
        name: "Major Pentatonic",
        intervals: [0,2,4,7,9]
    },

    minorPentatonic: {
        name: "Minor Pentatonic",
        intervals: [0,3,5,7,10]
    },

    blues: {
        name: "Blues",
        intervals: [0,3,5,6,7,10]
    },


    lydianDominant: {
        name: "Lydian Dominant",
        intervals: [0,2,4,6,7,9,10]
    },

    altered: {
        name: "Altered",
        intervals: [0,1,3,4,6,8,10]
    },

    wholeTone: {
        name: "Whole Tone",
        intervals: [0,2,4,6,8,10]
    },

    halfWholeDiminished: {
        name: "Half-Whole Diminished",
        intervals: [0,1,3,4,6,7,9,10]
    },

    wholeHalfDiminished: {
        name: "Whole-Half Diminished",
        intervals: [0,2,3,5,6,8,9,11]
    },

    bebopDominant: {
        name: "Bebop Dominant",
        intervals: [0,2,4,5,7,9,10,11]
    },

    bebopMajor: {
        name: "Bebop Major",
        intervals: [0,2,4,5,7,8,9,11]
    },

    bebopMinor: {
        name: "Bebop Minor",
        intervals: [0,2,3,5,7,9,10,11]
    },


    phrygianDominant: {
        name: "Phrygian Dominant",
        intervals: [0,1,4,5,7,8,10]
    },

    hirajoshi: {
        name: "Hirajoshi",
        intervals: [0,2,3,7,8]
    },

    hungarianMinor: {
        name: "Hungarian Minor",
        intervals: [0,2,3,6,7,8,11]
    },

    doubleHarmonicMajor: {
        name: "Double Harmonic Major",
        intervals: [0,1,4,5,7,8,11]
    }

};


/* =========================================================
   STANDARD GUITAR TUNING

   Low → High
========================================================= */

const strings = [

    {
        name: "E",
        pitch: 4
    },

    {
        name: "A",
        pitch: 9
    },

    {
        name: "D",
        pitch: 2
    },

    {
        name: "G",
        pitch: 7
    },

    {
        name: "B",
        pitch: 11
    },

    {
        name: "E",
        pitch: 4
    }

];


/* =========================================================
   POSITIONS

   Deliberately overlapping.
========================================================= */

const positions = [

    {
        start: 1,
        end: 5
    },

    {
        start: 4,
        end: 8
    },

    {
        start: 7,
        end: 11
    },

    {
        start: 10,
        end: 14
    },

    {
        start: 13,
        end: 17
    }

];


/* =========================================================
   INTERVAL NAMES
========================================================= */

const intervalNames = {

    0: "R",

    1: "m2",
    2: "M2",

    3: "m3",
    4: "M3",

    5: "P4",

    6: "TT",

    7: "P5",

    8: "m6",
    9: "M6",

    10: "m7",
    11: "M7"

};


/* =========================================================
   STATE
========================================================= */

let currentRoot = "C";

let currentScale = "major";

let currentPosition = 0;

let displayMode = "both";


/* =========================================================
   DOM
========================================================= */

const rootSelect =
    document.getElementById(
        "rootSelect"
    );

const scaleButton =
    document.getElementById(
        "scaleButton"
    );

const selectedScale =
    document.getElementById(
        "selectedScale"
    );

const menuPanel =
    document.getElementById(
        "menuPanel"
    );

const scaleName =
    document.getElementById(
        "scaleName"
    );

const scaleNotes =
    document.getElementById(
        "scaleNotes"
    );

const fretboard =
    document.getElementById(
        "fretboard"
    );

const positionTitle =
    document.getElementById(
        "positionTitle"
    );

const positionFrets =
    document.getElementById(
        "positionFrets"
    );

const positionDots =
    document.getElementById(
        "positionDots"
    );

const prevPosition =
    document.getElementById(
        "prevPosition"
    );

const nextPosition =
    document.getElementById(
        "nextPosition"
    );


/* =========================================================
   SPELLING NOTES
========================================================= */

function spellNote(
    root,
    semitones,
    degreeIndex
) {

    const rootLetter =
        root[0];

    const rootLetterIndex =
        letterOrder.indexOf(
            rootLetter
        );

    const targetLetter =
        letterOrder[
            (
                rootLetterIndex +
                degreeIndex
            ) % 7
        ];

    const targetPitch =
        (
            pitchClass[root] +
            semitones
        ) % 12;

    let difference =
        targetPitch -
        naturalPitch[targetLetter];

    /*
       Normalize to -6 … +5.
    */

    difference =
        ((difference + 6) % 12) - 6;

    let accidental = "";

    if (difference === 1) {
        accidental = "#";
    }

    if (difference === 2) {
        accidental = "##";
    }

    if (difference === -1) {
        accidental = "b";
    }

    if (difference === -2) {
        accidental = "bb";
    }

    return (
        targetLetter +
        accidental
    );
}


function getScaleNotes() {

    const scale =
        scales[currentScale];

    return scale.intervals.map(
        (interval, index) =>
            spellNote(
                currentRoot,
                interval,
                index
            )
    );
}


/* =========================================================
   INTERVAL
========================================================= */

function getIntervalName(
    semitones
) {

    return (
        intervalNames[
            semitones % 12
        ] || ""
    );
}


/* =========================================================
   CREATE NOTE
========================================================= */

function createNoteElement(
    noteName,
    interval,
    isRoot
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note" +
        (
            isRoot
            ? " root"
            : ""
        );


    const name =
        document.createElement(
            "div"
        );

    name.textContent =
        noteName;


    const intervalElement =
        document.createElement(
            "div"
        );

    intervalElement.className =
        "interval";

    intervalElement.textContent =
        getIntervalName(
            interval
        );


    if (
        displayMode === "notes"
    ) {

        intervalElement.style.display =
            "none";
    }


    if (
        displayMode === "intervals"
    ) {

        name.style.display =
            "none";
    }


    note.appendChild(name);

    note.appendChild(
        intervalElement
    );

    return note;
}


/* =========================================================
   SCALE INFO
========================================================= */

function renderScaleInfo() {

    const scale =
        scales[currentScale];

    const notes =
        getScaleNotes();


    scaleName.textContent =
        currentRoot +
        " " +
        scale.name;


    scaleNotes.textContent =
        notes.join(" · ");


    selectedScale.textContent =
        scale.name;
}


/* =========================================================
   POSITION INFO
========================================================= */

function renderPositionInfo() {

    const position =
        positions[
            currentPosition
        ];


    positionTitle.textContent =
        "Position " +
        (
            currentPosition + 1
        ) +
        " / " +
        positions.length;


    positionFrets.textContent =
        "Frets " +
        position.start +
        " – " +
        position.end;


    positionDots.innerHTML = "";


    positions.forEach(
        (_, index) => {

            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "position-dot" +
                (
                    index ===
                    currentPosition
                    ? " active"
                    : ""
                );

            positionDots.appendChild(
                dot
            );
        }
    );
}


/* =========================================================
   FRETBOARD
========================================================= */

function renderFretboard() {

    fretboard.innerHTML = "";


    const scale =
        scales[currentScale];

    const intervals =
        scale.intervals;

    const notes =
        getScaleNotes();

    const position =
        positions[
            currentPosition
        ];


    strings.forEach(
        string => {

            /*
               STRING LABEL
            */

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "string-label";

            label.textContent =
                string.name;

            fretboard.appendChild(
                label
            );


            /*
               FRETS
            */

            for (
                let fret =
                    position.start;

                fret <=
                    position.end;

                fret++
            ) {

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "fret";


                const fretNumber =
                    document.createElement(
                        "div"
                    );

                fretNumber.className =
                    "fret-number";

                fretNumber.textContent =
                    fret;

                cell.appendChild(
                    fretNumber
                );


                /*
                   Calculate pitch.
                */

                const pitch =
                    (
                        string.pitch +
                        fret
                    ) % 12;


                /*
                   Distance from root.
                */

                const interval =
                    (
                        pitch -
                        pitchClass[
                            currentRoot
                        ] +
                        12
                    ) % 12;


                /*
                   Is this pitch part
                   of the scale?
                */

                const scaleIndex =
                    intervals.indexOf(
                        interval
                    );


                if (
                    scaleIndex !== -1
                ) {

                    const noteName =
                        notes[
                            scaleIndex
                        ];


                    const isRoot =
                        interval === 0;


                    const noteElement =
                        createNoteElement(
                            noteName,
                            interval,
                            isRoot
                        );


                    cell.appendChild(
                        noteElement
                    );
                }


                fretboard.appendChild(
                    cell
                );
            }

        }
    );
}


/* =========================================================
   FULL RENDER
========================================================= */

function render() {

    renderScaleInfo();

    renderPositionInfo();

    renderFretboard();
}


/* =========================================================
   ROOT CHANGE
========================================================= */

rootSelect.addEventListener(
    "change",
    () => {

        currentRoot =
            rootSelect.value;

        render();

    }
);


/* =========================================================
   SCALE MENU
========================================================= */

scaleButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        menuPanel.classList.toggle(
            "open"
        );

    }
);


document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(
                ".scale-menu"
            )
        ) {

            menuPanel.classList.remove(
                "open"
            );
        }

    }
);


/* =========================================================
   CATEGORY ACCORDIONS
========================================================= */

document
    .querySelectorAll(
        ".category-header"
    )
    .forEach(
        header => {

            header.addEventListener(
                "click",
                () => {

                    const category =
                        header.parentElement;

                    category.classList.toggle(
                        "open"
                    );

                }
            );

        }
    );


/* =========================================================
   SCALE SELECTION
========================================================= */

document
    .querySelectorAll(
        ".scale-item"
    )
    .forEach(
        item => {

            item.addEventListener(
                "click",
                () => {

                    currentScale =
                        item.dataset.scale;

                    currentPosition =
                        0;


                    /*
                       Update active state
                       for duplicate entries.
                    */

                    document
                        .querySelectorAll(
                            ".scale-item"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "active"
                                );

                            }
                        );


                    document
                        .querySelectorAll(
                            `[data-scale="${currentScale}"]`
                        )
                        .forEach(
                            matching => {

                                matching.classList.add(
                                    "active"
                                );

                            }
                        );


                    menuPanel.classList.remove(
                        "open"
                    );


                    render();

                }
            );

        }
    );


/* =========================================================
   DISPLAY MODE
========================================================= */

document
    .querySelectorAll(
        ".display-switch button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    displayMode =
                        button.dataset.display;


                    document
                        .querySelectorAll(
                            ".display-switch button"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    renderFretboard();

                }
            );

        }
    );


/* =========================================================
   POSITION PREVIOUS
========================================================= */

prevPosition.addEventListener(
    "click",
    () => {

        currentPosition--;

        if (
            currentPosition < 0
        ) {

            currentPosition =
                positions.length - 1;
        }

        render();

    }
);


/* =========================================================
   POSITION NEXT
========================================================= */

nextPosition.addEventListener(
    "click",
    () => {

        currentPosition++;

        if (
            currentPosition >=
            positions.length
        ) {

            currentPosition = 0;
        }

        render();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

render();

</script>

</body>
</html>

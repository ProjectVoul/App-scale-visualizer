<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ProjectVoul</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #101010;
    color: #f4f4f4;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;

    padding:
        24px
        max(18px, env(safe-area-inset-right))
        40px
        max(18px, env(safe-area-inset-left));
}


/* ==================================================
   HEADER
================================================== */

.header {
    text-align: center;
    margin-bottom: 26px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
}

.subtitle {
    margin-top: 5px;
    color: #888;
    font-size: 14px;
}


/* ==================================================
   CONTROLS
================================================== */

.controls {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);
    gap: 12px;

    max-width: 760px;
    margin: 0 auto 18px;
}

.root-button,
.scale-button {
    height: 64px;

    border-radius: 18px;
    border: 1px solid #484848;

    background: #222;
    color: #f4f4f4;

    cursor: pointer;
}

.root-button {
    font-size: 20px;
}

.scale-button {
    padding: 0 22px;

    text-align: left;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.scale-button .arrow {
    color: #888;
    font-size: 15px;
}


/* ==================================================
   ROOT NOTE MENU
================================================== */

.root-menu {
    max-width: 760px;
    margin: 0 auto 18px;

    padding: 28px;

    background: #1c1c1c;

    border: 1px solid #414141;
    border-radius: 22px;

    display: none;

    position: relative;
    z-index: 30;
}

.root-menu.open {
    display: block;
}

.root-menu-title {
    text-align: center;

    color: #999;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.12em;

    margin-bottom: 18px;
}

.root-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 10px;
}

.root-option {
    min-height: 58px;

    border-radius: 15px;
    border: 1px solid #3b3b3b;

    background: #242424;
    color: #eee;

    cursor: pointer;

    font-size: 17px;
    font-weight: 600;
}

.root-option:hover {
    background: #2d2d2d;
}

.root-option.active {
    background: #f2f2f2;
    color: #151515;
}


/* ==================================================
   SCALE MENU
================================================== */

.scale-menu {
    max-width: 760px;
    margin: 0 auto;

    background: #1c1c1c;

    border: 1px solid #414141;
    border-radius: 22px;

    overflow: hidden;

    display: none;

    position: relative;
    z-index: 20;
}

.scale-menu.open {
    display: block;
}

.category {
    border-bottom: 1px solid #333;
}

.category:last-child {
    border-bottom: 0;
}

.category-header {
    width: 100%;
    min-height: 62px;

    padding: 0 24px;

    background: transparent;
    border: 0;

    color: #aaa;

    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.06em;

    cursor: pointer;
}

.category-header .chevron {
    font-size: 15px;

    transition:
        transform 0.2s ease;
}

.category.open .category-header .chevron {
    transform: rotate(90deg);
}

.scale-list {
    display: none;

    padding:
        0
        14px
        12px;
}

.category.open .scale-list {
    display: block;
}

.scale-option {
    width: 100%;
    min-height: 54px;

    border: 0;
    border-radius: 14px;

    background: transparent;
    color: #eee;

    text-align: left;

    padding: 0 14px;

    cursor: pointer;

    font-size: 16px;
}

.scale-option:hover {
    background: #292929;
}

.scale-option.active {
    background: #f2f2f2;
    color: #151515;
}


/* ==================================================
   DISPLAY
================================================== */

.display-label {
    text-align: center;

    margin-top: 28px;
    margin-bottom: 12px;

    color: #8b8b8b;

    font-size: 14px;

    letter-spacing: 0.12em;

    font-weight: 600;
}

.display-toggle {
    width: min(440px, 100%);

    margin: 0 auto 30px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    background: #242424;

    border: 1px solid #474747;

    border-radius: 18px;

    padding: 4px;
}

.display-toggle button {
    height: 52px;

    border: 0;
    border-radius: 14px;

    background: transparent;
    color: #999;

    cursor: pointer;

    font-size: 16px;
}

.display-toggle button.active {
    background: #f1f1f1;
    color: #151515;
}


/* ==================================================
   SCALE INFORMATION
================================================== */

.scale-info {
    text-align: center;

    margin-bottom: 24px;
}

.scale-title {
    font-size:
        clamp(27px, 5vw, 42px);

    font-weight: 750;

    line-height: 1.1;

    margin: 0;
}

.scale-notes {
    margin-top: 14px;

    color: #aaa;

    font-size:
        clamp(16px, 2.5vw, 21px);

    letter-spacing: 0.06em;
}


/* ==================================================
   POSITION NAVIGATION
================================================== */

.position-header {
    display: grid;

    grid-template-columns:
        72px
        minmax(0, 1fr)
        72px;

    align-items: center;

    width: min(760px, 100%);

    margin: 0 auto 18px;

    column-gap: 14px;
}

.position-arrow {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    border: 1px solid #444;

    background: #1d1d1d;

    color: #f2f2f2;

    font-size: 38px;
    line-height: 1;

    cursor: pointer;
}

.position-center {
    min-width: 0;

    text-align: center;
}

.position-title {
    font-size:
        clamp(23px, 4vw, 30px);

    font-weight: 700;

    line-height: 1.15;
}

.fret-range {
    margin-top: 7px;

    color: #888;

    font-size: 16px;
}

.position-dots {
    margin-top: 12px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;
}

.position-dot {
    width: 15px;
    height: 15px;

    flex: 0 0 15px;

    border-radius: 50%;

    background: #3d3d3d;
}

.position-dot.active {
    background: #f1f1f1;
}


/* ==================================================
   FRETBOARD
================================================== */

.fretboard-wrap {
    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding:
        0 8px;
}

.fretboard {

    /*
       Five visual study positions.

       Position 1 = frets 1–5
       Position 2 = frets 6–10
       Position 3 = frets 11–15
       Position 4 = frets 16–20
       Position 5 = frets 21–24

       These are visual zones of the guitar
       neck, not theoretical CAGED positions.
    */

    --fret-count: 5;
    --label-width: 78px;

    width: 100%;

    display: grid;

    grid-template-columns:
        var(--label-width)
        repeat(
            var(--fret-count),
            minmax(0, 1fr)
        );

    border: 4px solid #3b3b3b;

    border-radius: 24px;

    overflow: hidden;

    background: #93612d;
}


/* ==================================================
   STRING LABELS
================================================== */

.string-label {
    min-width: 0;

    min-height: 118px;

    background: #303030;

    border-right: 3px solid #444;

    border-bottom:
        2px solid #b17a3e;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(20px, 3vw, 30px);

    font-weight: 600;
}


/* ==================================================
   FRET CELLS
================================================== */

.fret {
    min-width: 0;

    min-height: 118px;

    position: relative;

    background: #99632e;

    border-right:
        3px solid #bc8242;

    border-bottom:
        2px solid #bc8242;

    display: flex;

    align-items: center;
    justify-content: center;
}

.fret.last-column {
    border-right: 0;
}

.string-label.last-row,
.fret.last-row {
    border-bottom: 0;
}


/* ==================================================
   FRET NUMBER
================================================== */

.fret-number {
    position: absolute;

    right: 7px;
    bottom: 4px;

    color:
        rgba(255,255,255,0.65);

    font-size: 14px;

    pointer-events: none;
}


/* ==================================================
   NOTES
================================================== */

.note {
    width:
        clamp(56px, 7vw, 82px);

    height:
        clamp(56px, 7vw, 82px);

    border-radius: 50%;

    background: #f3f3f3;

    color: #151515;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    line-height: 1;

    font-weight: 700;

    position: relative;

    z-index: 2;
}

.note-name {
    font-size:
        clamp(18px, 2.4vw, 26px);
}

.note-interval {
    margin-top: 7px;

    font-size:
        clamp(13px, 1.7vw, 18px);

    font-weight: 700;
}

.note.root {
    background: #ef334d;
    color: white;
}


/* ==================================================
   LEGEND
================================================== */

.legend {
    margin: 22px auto 0;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 28px;

    color: #999;

    font-size: 16px;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 9px;
}

.legend-dot {
    width: 17px;
    height: 17px;

    border-radius: 50%;
}

.legend-dot.root {
    background: #ef334d;
}

.legend-dot.scale {
    background: #f3f3f3;
}


/* ==================================================
   LANDSCAPE
================================================== */

@media
(orientation: landscape)
and (max-height: 600px) {

    .app {
        padding-top: 14px;
        padding-bottom: 24px;
    }

    .header {
        margin-bottom: 14px;
    }

    .logo {
        font-size: 22px;
    }

    .subtitle {
        display: none;
    }

    .display-label {
        margin-top: 16px;
    }

    .scale-info {
        margin-bottom: 14px;
    }

    .scale-notes {
        margin-top: 8px;
    }

    .position-header {
        margin-bottom: 12px;
    }

    .position-arrow {
        width: 58px;
        height: 58px;
    }

    .position-header {
        grid-template-columns:
            58px
            minmax(0, 1fr)
            58px;
    }

    .fretboard {
        --label-width: 64px;
    }

    .string-label,
    .fret {
        min-height: 86px;
    }

    .note {
        width: 58px;
        height: 58px;
    }

    .note-name {
        font-size: 17px;
    }

    .note-interval {
        font-size: 12px;
        margin-top: 5px;
    }

    .legend {
        margin-top: 14px;
    }
}


/* ==================================================
   SMALL PHONES
================================================== */

@media
(max-width: 430px) {

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }

    .controls {
        grid-template-columns:
            92px
            minmax(0, 1fr);
    }

    .root-button,
    .scale-button {
        height: 58px;
    }

    .scale-button {
        padding: 0 16px;
    }

    .root-menu {
        padding: 20px 14px;
    }

    .root-grid {
        gap: 8px;
    }

    .root-option {
        min-height: 54px;
        font-size: 16px;
    }

    .position-header {
        grid-template-columns:
            58px
            minmax(0, 1fr)
            58px;

        column-gap: 8px;
    }

    .position-arrow {
        width: 58px;
        height: 58px;

        font-size: 31px;
    }

    .position-dots {
        gap: 9px;
    }

    .position-dot {
        width: 12px;
        height: 12px;

        flex-basis: 12px;
    }

    .fretboard-wrap {
        padding-left: 2px;
        padding-right: 2px;
    }

    .fretboard {
        --label-width: 52px;

        border-width: 3px;

        border-radius: 20px;
    }

    .string-label,
    .fret {
        min-height: 100px;
    }

    .string-label {
        border-right-width: 2px;
    }

    .fret {
        border-right-width: 2px;
    }

    .note {
        width: 56px;
        height: 56px;
    }

    .note-name {
        font-size: 17px;
    }

    .note-interval {
        font-size: 12px;
        margin-top: 5px;
    }

    .fret-number {
        right: 5px;
        font-size: 12px;
    }

    .legend {
        gap: 18px;
        font-size: 14px;
    }
}

</style>

</head>


<body>

<div class="app">


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="logo">
            ProjectVoul
        </div>

        <div class="subtitle">
            Guitar · Scales · Notes
        </div>

    </header>


    <!-- ==================================================
         CONTROLS
    ================================================== -->

    <div class="controls">

        <button
            class="root-button"
            id="rootButton">

            C

        </button>


        <button
            class="scale-button"
            id="scaleButton">

            <span id="selectedScale">
                Major / Ionian
            </span>

            <span class="arrow">
                ▾
            </span>

        </button>

    </div>


    <!-- ==================================================
         ROOT MENU
    ================================================== -->

    <div
        class="root-menu"
        id="rootMenu">

        <div class="root-menu-title">
            ROOT NOTE
        </div>

        <div
            class="root-grid"
            id="rootGrid">

            <button class="root-option active" data-root="C">
                C
            </button>

            <button class="root-option" data-root="C#">
                C#
            </button>

            <button class="root-option" data-root="Db">
                Db
            </button>

            <button class="root-option" data-root="D">
                D
            </button>

            <button class="root-option" data-root="D#">
                D#
            </button>

            <button class="root-option" data-root="Eb">
                Eb
            </button>

            <button class="root-option" data-root="E">
                E
            </button>

            <button class="root-option" data-root="F">
                F
            </button>

            <button class="root-option" data-root="F#">
                F#
            </button>

            <button class="root-option" data-root="Gb">
                Gb
            </button>

            <button class="root-option" data-root="G">
                G
            </button>

            <button class="root-option" data-root="G#">
                G#
            </button>

            <button class="root-option" data-root="Ab">
                Ab
            </button>

            <button class="root-option" data-root="A">
                A
            </button>

            <button class="root-option" data-root="A#">
                A#
            </button>

            <button class="root-option" data-root="Bb">
                Bb
            </button>

            <button class="root-option" data-root="B">
                B
            </button>

        </div>

    </div>


    <!-- ==================================================
         SCALE MENU
    ================================================== -->

    <div
        class="scale-menu"
        id="scaleMenu">


        <section class="category open">

            <button class="category-header">

                <span>
                    DIATONIC
                </span>

                <span class="chevron">
                    ›
                </span>

            </button>


            <div class="scale-list">

                <button
                    class="scale-option active"
                    data-scale="major">

                    Major / Ionian

                </button>

                <button
                    class="scale-option"
                    data-scale="dorian">

                    Dorian

                </button>

                <button
                    class="scale-option"
                    data-scale="phrygian">

                    Phrygian

                </button>

                <button
                    class="scale-option"
                    data-scale="lydian">

                    Lydian

                </button>

                <button
                    class="scale-option"
                    data-scale="mixolydian">

                    Mixolydian

                </button>

                <button
                    class="scale-option"
                    data-scale="naturalMinor">

                    Natural Minor / Aeolian

                </button>

                <button
                    class="scale-option"
                    data-scale="locrian">

                    Locrian

                </button>

            </div>

        </section>


        <section class="category">

            <button class="category-header">

                <span>
                    MINOR
                </span>

                <span class="chevron">
                    ›
                </span>

            </button>


            <div class="scale-list">

                <button
                    class="scale-option"
                    data-scale="naturalMinor">

                    Natural Minor / Aeolian

                </button>

                <button
                    class="scale-option"
                    data-scale="harmonicMinor">

                    Harmonic Minor

                </button>

                <button
                    class="scale-option"
                    data-scale="melodicMinor">

                    Melodic Minor

                </button>

            </div>

        </section>


        <section class="category">

            <button class="category-header">

                <span>
                    PENTATONIC &amp; BLUES
                </span>

                <span class="chevron">
                    ›
                </span>

            </button>


            <div class="scale-list">

                <button
                    class="scale-option"
                    data-scale="majorPentatonic">

                    Major Pentatonic

                </button>

                <button
                    class="scale-option"
                    data-scale="minorPentatonic">

                    Minor Pentatonic

                </button>

                <button
                    class="scale-option"
                    data-scale="blues">

                    Blues

                </button>

            </div>

        </section>


        <section class="category">

            <button class="category-header">

                <span>
                    JAZZ
                </span>

                <span class="chevron">
                    ›
                </span>

            </button>


            <div class="scale-list">

                <button
                    class="scale-option"
                    data-scale="lydianDominant">

                    Lydian Dominant

                </button>

                <button
                    class="scale-option"
                    data-scale="altered">

                    Altered

                </button>

                <button
                    class="scale-option"
                    data-scale="wholeTone">

                    Whole Tone

                </button>

                <button
                    class="scale-option"
                    data-scale="halfWholeDiminished">

                    Half-Whole Diminished

                </button>

                <button
                    class="scale-option"
                    data-scale="wholeHalfDiminished">

                    Whole-Half Diminished

                </button>

                <button
                    class="scale-option"
                    data-scale="bebopDominant">

                    Bebop Dominant

                </button>

                <button
                    class="scale-option"
                    data-scale="bebopMajor">

                    Bebop Major

                </button>

                <button
                    class="scale-option"
                    data-scale="bebopMinor">

                    Bebop Minor

                </button>

            </div>

        </section>


        <section class="category">

            <button class="category-header">

                <span>
                    EXOTIC / WORLD
                </span>

                <span class="chevron">
                    ›
                </span>

            </button>


            <div class="scale-list">

                <button
                    class="scale-option"
                    data-scale="phrygianDominant">

                    Phrygian Dominant

                </button>

                <button
                    class="scale-option"
                    data-scale="hirajoshi">

                    Hirajoshi

                </button>

                <button
                    class="scale-option"
                    data-scale="hungarianMinor">

                    Hungarian Minor

                </button>

                <button
                    class="scale-option"
                    data-scale="doubleHarmonicMajor">

                    Double Harmonic Major

                </button>

            </div>

        </section>

    </div>


    <!-- ==================================================
         DISPLAY
    ================================================== -->

    <div class="display-label">
        DISPLAY
    </div>


    <div class="display-toggle">

        <button data-display="notes">
            Notes
        </button>

        <button data-display="intervals">
            Intervals
        </button>

        <button
            class="active"
            data-display="both">

            Both

        </button>

    </div>


    <!-- ==================================================
         SCALE INFORMATION
    ================================================== -->

    <section class="scale-info">

        <h1
            class="scale-title"
            id="scaleTitle">

            C Major / Ionian

        </h1>


        <div
            class="scale-notes"
            id="scaleNotes">

            C · D · E · F · G · A · B

        </div>

    </section>


    <!-- ==================================================
         POSITION NAVIGATION
    ================================================== -->

    <section class="position-header">

        <button
            class="position-arrow"
            id="previousPosition">

            ‹

        </button>


        <div class="position-center">

            <div
                class="position-title"
                id="positionTitle">

                Position 1 / 5

            </div>


            <div
                class="fret-range"
                id="fretRange">

                Frets 1 – 5

            </div>


            <div
                class="position-dots"
                id="positionDots">
            </div>

        </div>


        <button
            class="position-arrow"
            id="nextPosition">

            ›

        </button>

    </section>


    <!-- ==================================================
         FRETBOARD
    ================================================== -->

    <div class="fretboard-wrap">

        <div
            class="fretboard"
            id="fretboard">
        </div>

    </div>


    <!-- ==================================================
         LEGEND
    ================================================== -->

    <div class="legend">

        <div class="legend-item">

            <span
                class="legend-dot root">
            </span>

            <span>
                Root
            </span>

        </div>


        <div class="legend-item">

            <span
                class="legend-dot scale">
            </span>

            <span>
                Scale note
            </span>

        </div>

    </div>

</div>


<script>


/* ==================================================
   MUSIC DATA
================================================== */

const chromatic = [
    "C",
    "C#",
    "D",
    "D#",
    "E",
    "F",
    "F#",
    "G",
    "G#",
    "A",
    "A#",
    "B"
];


const sharpNames = {

    0: "C",
    1: "C#",
    2: "D",
    3: "D#",
    4: "E",
    5: "F",
    6: "F#",
    7: "G",
    8: "G#",
    9: "A",
    10: "A#",
    11: "B"

};


const flatNames = {

    0: "C",
    1: "Db",
    2: "D",
    3: "Eb",
    4: "E",
    5: "F",
    6: "Gb",
    7: "G",
    8: "Ab",
    9: "A",
    10: "Bb",
    11: "B"

};


/*
   Scale interval definitions.

   Every interval is measured in semitones
   from the root.
*/

const scaleData = {

    major: {
        name: "Major / Ionian",
        intervals: [
            0, 2, 4, 5, 7, 9, 11
        ]
    },

    dorian: {
        name: "Dorian",
        intervals: [
            0, 2, 3, 5, 7, 9, 10
        ]
    },

        intervals: [
            0, 1, 3, 5, 7, 8, 10
        ]
    },

        intervals: [

        ]
    },

        intervals: [
            0, 2, 4, 5, 7, 9, 10
        ]
    },

        intervals: [

        ]
    },

        intervals: [
            0, 1, 3, 5, 6, 8, 10
        ]
    },

        intervals: [
            0, 2, 3, 5, 7, 8, 11
        ]
    },

    melodicMinor: {
        name: "Melodic Minor",
        intervals: [
            0, 2, 3, 5, 7, 9, 11
        ]
    },

    majorPentatonic: {
        name: "Major Pentatonic",
        intervals: [
            0, 2, 4, 7, 9
        ]
    },

    minorPentatonic: {
        name: "Minor Pentatonic",
        intervals: [
            0, 3, 5, 7, 10
        ]
    },

    blues: {

        intervals: [
            0, 3, 5, 6, 7, 10
        ]
    },

        intervals: [
            0, 2, 4, 6, 7, 9, 10
        ]
    },

        intervals: [
            0, 1, 3, 4, 6, 8, 10
        ]
    },

        intervals: [
            0, 2, 4, 6, 8, 10
        ]
    },

        name: "Half-Whole Diminished",
        intervals: [
            0, 1, 3, 4, 6, 7, 9, 10
        ]
    },

        ]

        ]
    },

        ]

/* ==================================================
   GUITAR
================================================== */

/*
   Standard tuning:

   Low → High

   E A D G B E
*/

const strings = [

    {
        name: "E",
        pitch: 4
    },

    {
        name: "A",
        pitch: 9
    },

    {
        name: "D",
        pitch: 2
    },

    {
        name: "G",
        pitch: 7
    },

    {
        name: "B",
        pitch: 11
    },

    {
        name: "E",
        pitch: 4
    }

];


const MAX_FRET = 24;


/*
   Five visual study zones.

   These are NOT canonical CAGED positions.

   1 → 1–5
   2 → 6–10
   3 → 11–15
   4 → 16–20
   5 → 21–24
*/

const positions = [

    {
        start: 1,
        end: 5
    },

    {
        start: 6,
        end: 10
    },

    {
        start: 11,
        end: 15
    },

    {
        start: 16,
        end: 20
    },

    {
        start: 21,
        end: 24
    }

];


const POSITION_COUNT =
    positions.length;


let currentRoot = "C";

let currentScale = "major";

let currentPosition = 0;

let displayMode = "both";


/* ==================================================
   HELPERS
================================================== */

function noteIndex(note) {

    const sharpIndex =
        chromatic.indexOf(note);

    if (sharpIndex !== -1) {
        return sharpIndex;
    }


    const flatToSharp = {

        "Db": 1,
        "Eb": 3,
        "Gb": 6,
        "Ab": 8,
        "Bb": 10

    };


    return flatToSharp[note];

}


/*
   Decide whether the selected root should use
   sharp or flat spellings.

   Natural keys use sharps where necessary:

   D  → F# C#
   E  → F# G# C# D#
   G  → F#
   A  → C# F# G#
   B  → C# D# F# G# A#

   Flat roots use flat spellings:

   Db → Db Eb Gb Ab Bb
   Eb → Eb Ab Bb
   F  → Bb
   Gb → Gb Ab Bb Db Eb
   Ab → Ab Bb Db Eb
   Bb → Bb Eb Ab
*/

function usesFlats() {

    const flatRoots = [
        "Db",
        "Eb",
        "Gb",
        "Ab",
        "Bb"
    ];

    return flatRoots.includes(
        currentRoot
    );

}


/*
   Return the displayed name for a pitch.

   This keeps the existing pitch calculation intact
   while making the written note names consistent
   with the selected root/key.
*/

function getNoteName(pitch) {

    const normalizedPitch =
        (pitch + 12) % 12;


    if (usesFlats()) {

        return flatNames[
            normalizedPitch
        ];

    }


    return sharpNames[
        normalizedPitch
    ];

}


function getIntervalLabel(semitones) {

    const labels = {

        0: "R",
        1: "m2",
        2: "M2",
        3: "m3",
        4: "M3",
        5: "P4",
        6: "TT",
        7: "P5",
        8: "m6",
        9: "M6",
        10: "m7",
        11: "M7"

    };

    return labels[
        semitones % 12
    ];

}


/* ==================================================
   SCALE NOTES
================================================== */

function getScaleNotes() {

    const rootPitch =
        noteIndex(currentRoot);


    return scaleData[currentScale]
        .intervals
        .map(interval => {

            const pitch =
                (rootPitch + interval) % 12;


            return {

                pitch,

                name:
                    getNoteName(pitch),

                interval

            };

        });

}


/* ==================================================
   SCALE INFORMATION
================================================== */

function updateScaleInfo() {

    const scale =
        scaleData[currentScale];


    document
        .getElementById("scaleTitle")
        .textContent =
            `${currentRoot} ${scale.name}`;


    const notes =
        getScaleNotes();


    document
        .getElementById("scaleNotes")
        .textContent =
            notes
                .map(note => note.name)
                .join(" · ");


    document
        .getElementById("selectedScale")
        .textContent =
            scale.name;

}


/* ==================================================
   POSITION UI
================================================== */

function updatePositionUI() {

    const position =
        positions[currentPosition];


    document
        .getElementById("positionTitle")
        .textContent =
            `Position ${currentPosition + 1} / ${POSITION_COUNT}`;


    document
        .getElementById("fretRange")
        .textContent =
            `Frets ${position.start} – ${position.end}`;


    renderPositionDots();

}


function renderPositionDots() {

    const container =
        document.getElementById(
            "positionDots"
        );


    container.innerHTML = "";


    for (
        let i = 0;
        i < POSITION_COUNT;
        i++
    ) {

        const dot =
            document.createElement("span");


        dot.className =
            "position-dot";


        if (
            i === currentPosition
        ) {

            dot.classList.add(
                "active"
            );

        }


        container.appendChild(dot);

    }

}


/* ==================================================
   FRETBOARD
================================================== */

function renderFretboard() {

    const board =
        document.getElementById(
            "fretboard"
        );


    board.innerHTML = "";


    const scaleNotes =
        getScaleNotes();


    const scaleMap =
        new Map();


    scaleNotes.forEach(note => {

        scaleMap.set(
            note.pitch,
            note.interval
        );

    });


    const position =
        positions[currentPosition];


    const startFret =
        position.start;


    const endFret =
        Math.min(
            position.end,
            MAX_FRET
        );


    const fretCount =
        endFret -
        startFret +
        1;


    board.style.setProperty(
        "--fret-count",
        fretCount
    );


    strings.forEach(
        (string, stringIndex) => {


            const isLastRow =
                stringIndex ===
                strings.length - 1;


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "string-label";


            if (isLastRow) {

                label.classList.add(
                    "last-row"
                );

            }


            label.textContent =
                string.name;


            board.appendChild(label);


            for (
                let fret = startFret;
                fret <= endFret;
                fret++
            ) {


                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "fret";


                if (
                    fret === endFret
                ) {

                    cell.classList.add(
                        "last-column"
                    );

                }


                if (isLastRow) {

                    cell.classList.add(
                        "last-row"
                    );

                }


                /*
                   Calculate the exact pitch
                   at this string/fret.
                */

                const pitch =
                    (
                        string.pitch +
                        fret
                    ) % 12;


                /*
                   Only display notes belonging
                   to the selected scale.
                */

                if (
                    scaleMap.has(pitch)
                ) {


                    const interval =
                        scaleMap.get(pitch);


                    const note =
                        document.createElement(
                            "div"
                        );


                    note.className =
                        "note";


                    /*
                       Interval 0 is always the root.
                    */

                    if (
                        interval === 0
                    ) {

                        note.classList.add(
                            "root"
                        );

                    }


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "note-name";


                    name.textContent =
                        getNoteName(pitch);


                    const intervalLabel =
                        document.createElement(
                            "div"
                        );


                    intervalLabel.className =
                        "note-interval";


                    intervalLabel.textContent =
                        interval === 0
                            ? "R"
                            : getIntervalLabel(
                                interval
                              );


                    /*
                       DISPLAY MODE
                    */

                    if (
                        displayMode ===
                        "notes"
                    ) {

                        intervalLabel.style.display =
                            "none";

                    }


                    if (
                        displayMode ===
                        "intervals"
                    ) {

                        name.style.display =
                            "none";

                    }


                    note.appendChild(name);

                    note.appendChild(
                        intervalLabel
                    );


                    cell.appendChild(note);

                }


                /*
                   Fret number
                */

                const fretNumber =
                    document.createElement(
                        "span"
                    );


                fretNumber.className =
                    "fret-number";


                fretNumber.textContent =
                    fret;


                cell.appendChild(
                    fretNumber
                );


                board.appendChild(
                    cell
                );

            }

        }

    );

}


/* ==================================================
   POSITION NAVIGATION
================================================== */

function nextPosition() {

    currentPosition++;

    if (
        currentPosition >=
        POSITION_COUNT
    ) {

        currentPosition = 0;

    }


    updateAll();

}


function previousPosition() {

    currentPosition--;

    if (
        currentPosition < 0
    ) {

        currentPosition =
            POSITION_COUNT - 1;

    }


    updateAll();

}


/* ==================================================
   FULL UPDATE
================================================== */

function updateAll() {

    updateScaleInfo();

    updatePositionUI();

    renderFretboard();

}


/* ==================================================
   ROOT MENU
================================================== */

const rootButton =
    document.getElementById(
        "rootButton"
    );


const rootMenu =
    document.getElementById(
        "rootMenu"
    );


rootButton.addEventListener(
    "click",
    () => {

        rootMenu.classList.toggle(
            "open"
        );


        scaleMenu.classList.remove(
            "open"
        );

    }
);


document
    .querySelectorAll(".root-option")
    .forEach(option => {


        option.addEventListener(
            "click",
            () => {


                currentRoot =
                    option.dataset.root;


                rootButton.textContent =
                    currentRoot;


                document
                    .querySelectorAll(
                        ".root-option"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                option.classList.add(
                    "active"
                );


                rootMenu.classList.remove(
                    "open"
                );


                /*
                   Return to the first visual
                   position when changing root.
                */

                currentPosition = 0;


                updateAll();

            }
        );

    });


/* ==================================================
   SCALE MENU
================================================== */

const scaleButton =
    document.getElementById(
        "scaleButton"
    );


const scaleMenu =
    document.getElementById(
        "scaleMenu"
    );


scaleButton.addEventListener(
    "click",
    () => {

        scaleMenu.classList.toggle(
            "open"
        );


        rootMenu.classList.remove(
            "open"
        );

    }
);


document
    .querySelectorAll(".category-header")
    .forEach(header => {


        header.addEventListener(
            "click",
            () => {


                const category =
                    header.parentElement;


                category.classList.toggle(
                    "open"
                );

            }
        );

    });


document
    .querySelectorAll(".scale-option")
    .forEach(option => {


        option.addEventListener(
            "click",
            () => {


                currentScale =
                    option.dataset.scale;


                document
                    .querySelectorAll(
                        ".scale-option"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                /*
                   A scale can appear in more than
                   one category.

                   Activate all matching entries.
                */

                document
                    .querySelectorAll(
                        `.scale-option[data-scale="${currentScale}"]`
                    )
                    .forEach(item => {

                        item.classList.add(
                            "active"
                        );

                    });


                scaleMenu.classList.remove(
                    "open"
                );


                currentPosition = 0;


                updateAll();

            }
        );

    });


/* ==================================================
   POSITION BUTTONS
================================================== */

document
    .getElementById(
        "previousPosition"
    )
    .addEventListener(
        "click",
        previousPosition
    );


document
    .getElementById(
        "nextPosition"
    )
    .addEventListener(
        "click",
        nextPosition
    );


/* ==================================================
   SWIPE BETWEEN POSITIONS
================================================== */

const fretboardElement =
    document.getElementById(
        "fretboard"
    );


let touchStartX = 0;

let touchStartY = 0;


const SWIPE_THRESHOLD = 50;


fretboardElement.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


fretboardElement.addEventListener(
    "touchend",
    event => {


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        /*
           Ignore vertical gestures.
           This preserves normal page scrolling.
        */

        if (
            Math.abs(deltaY) >
            Math.abs(deltaX)
        ) {

            return;

        }


        /*
           Ignore short movements.
        */

        if (
            Math.abs(deltaX) <
            SWIPE_THRESHOLD
        ) {

            return;

        }


        /*
           Swipe left:
           next visual position.

           Swipe right:
           previous visual position.
        */

        if (
            deltaX < 0
        ) {

            nextPosition();

        } else {

            previousPosition();

        }

    }
);


/* ==================================================
   DISPLAY MODE
================================================== */

document
    .querySelectorAll(
        ".display-toggle button"
    )
    .forEach(button => {


        button.addEventListener(
            "click",
            () => {


                displayMode =
                    button.dataset.display;


                document
                    .querySelectorAll(
                        ".display-toggle button"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                renderFretboard();

            }
        );

    });


/* ==================================================
   INITIAL RENDER
================================================== */

updateAll();

</script>

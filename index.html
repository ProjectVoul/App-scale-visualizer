<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ProjectVoul</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #101010;
    color: #f4f4f4;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;

    padding:
        24px
        max(18px, env(safe-area-inset-right))
        40px
        max(18px, env(safe-area-inset-left));
}


/* ==================================================
   HEADER
================================================== */

.header {
    text-align: center;
    margin-bottom: 26px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
}

.subtitle {
    margin-top: 5px;
    color: #888;
    font-size: 14px;
}


/* ==================================================
   CONTROLS
================================================== */

.controls {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);

    gap: 12px;

    max-width: 760px;
    margin: 0 auto 18px;
}

.root-button,
.scale-button {
    height: 64px;

    border-radius: 18px;
    border: 1px solid #484848;

    background: #222;
    color: #f4f4f4;

    cursor: pointer;
}

.root-button {
    font-size: 20px;
}

.scale-button {
    padding: 0 22px;

    text-align: left;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.scale-button .arrow {
    color: #888;
    font-size: 15px;
}


/* ==================================================
   ROOT MENU
================================================== */

.root-menu {
    max-width: 760px;

    margin: 0 auto 14px;

    padding: 18px;

    background: #1c1c1c;

    border: 1px solid #414141;
    border-radius: 22px;

    display: none;

    position: relative;
    z-index: 20;
}

.root-menu.open {
    display: block;
}

.root-menu-title {
    margin-bottom: 14px;

    color: #888;

    text-align: center;

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 0.12em;
}

.root-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 8px;
}

.root-option {
    min-height: 48px;

    border: 1px solid #383838;
    border-radius: 12px;

    background: #242424;
    color: #eee;

    cursor: pointer;

    font-size: 16px;
    font-weight: 600;
}

.root-option:hover {
    background: #303030;
}

.root-option.active {
    background: #f2f2f2;
    color: #151515;
}


/* ==================================================
   SCALE MENU
================================================== */

.scale-menu {
    max-width: 760px;

    margin: 0 auto;

    background: #1c1c1c;

    border: 1px solid #414141;
    border-radius: 22px;

    overflow: hidden;

    display: none;

    position: relative;
    z-index: 20;
}

.scale-menu.open {
    display: block;
}

.category {
    border-bottom: 1px solid #333;
}

.category:last-child {
    border-bottom: 0;
}

.category-header {
    width: 100%;
    min-height: 62px;

    padding: 0 24px;

    background: transparent;
    border: 0;

    color: #aaa;

    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.06em;

    cursor: pointer;
}

.category-header .chevron {
    font-size: 15px;

    transition:
        transform 0.2s ease;
}

.category.open
.category-header
.chevron {
    transform: rotate(90deg);
}

.scale-list {
    display: none;
    padding: 0 14px 12px;
}

.category.open .scale-list {
    display: block;
}

.scale-option {
    width: 100%;
    min-height: 54px;

    border: 0;
    border-radius: 14px;

    background: transparent;
    color: #eee;

    text-align: left;

    padding: 0 14px;

    cursor: pointer;

    font-size: 16px;
}

.scale-option:hover {
    background: #292929;
}

.scale-option.active {
    background: #f2f2f2;
    color: #151515;
}


/* ==================================================
   WORKS WELL WITH
================================================== */

.works-with-wrap {
    width: min(760px, 100%);
    margin: 0 auto 22px;
}

.works-with-button {
    width: 100%;
    min-height: 58px;
    padding: 0 20px;
    border-radius: 18px;
    border: 1px solid #414141;
    background: #1c1c1c;
    color: #f4f4f4;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
}

.works-with-button .arrow {
    color: #888;
    font-size: 15px;
    transition: transform 0.2s ease;
}

.works-with-button.open .arrow {
    transform: rotate(90deg);
}

.works-with-menu {
    display: none;
    margin-top: 8px;
    padding: 10px;
    background: #1c1c1c;
    border: 1px solid #414141;
    border-radius: 20px;
}

.works-with-menu.open {
    display: block;
}

.works-with-title {
    padding: 8px 12px 10px;
    color: #888;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
}

.works-with-option {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: #eee;
    padding: 8px 14px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
}

.works-with-option:hover {
    background: #292929;
}

.works-with-option-name {
    font-size: 16px;
    font-weight: 650;
}

.works-with-option-relation {
    color: #888;
    font-size: 13px;
}

/* ==================================================
   COMPARISON MODE
================================================== */

.comparison-info {
    display: none;
    text-align: center;
    margin-bottom: 24px;
}

.comparison-info.open {
    display: block;
}

.comparison-title {
    font-size: clamp(24px, 4.5vw, 36px);
    font-weight: 750;
    line-height: 1.15;
    margin: 0;
}

.comparison-subtitle {
    margin-top: 10px;
    color: #999;
    font-size: 15px;
}

.comparison-legend {
    margin: 22px auto 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px 26px;
    color: #999;
    font-size: 15px;
}

.comparison-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.comparison-legend-dot {
    width: 17px;
    height: 17px;
    border-radius: 50%;
}

.comparison-legend-dot.scale-a {
    background: #f3f3f3;
}

.comparison-legend-dot.scale-b {
    background: #111;
    border: 1px solid #555;
}

.comparison-legend-dot.shared {
    background: #f3f3f3;
    border: 3px solid #777;
}

.comparison-legend-dot.root-a {
    background: #ef334d;
}

.comparison-legend-dot.root-b {
    background: #4a9eff;
}

.note.comparison-a {
    background: #f3f3f3;
    color: #151515;
}

.note.comparison-b {
    background: #111;
    color: #fff;
}

.note.comparison-shared {
    background: #f3f3f3;
    color: #151515;
    box-shadow: 0 0 0 4px #777;
}

.note.comparison-root-a {
    background: #ef334d;
    color: #fff;
}

.note.comparison-root-b {
    background: #4a9eff;
    color: #fff;
}

.note.comparison-shared-root {
    background: #ef334d;
    color: #fff;
    box-shadow: 0 0 0 4px #4a9eff;
}

.comparison-back {
    display: none;
    width: min(760px, 100%);
    margin: 0 auto 18px;
    min-height: 46px;
    border-radius: 14px;
    border: 1px solid #3d3d3d;
    background: #222;
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
    font-weight: 650;
}

.comparison-back.open {
    display: block;
}


/* ==================================================
   DISPLAY
================================================== */

.display-label {
    text-align: center;

    margin-top: 28px;
    margin-bottom: 12px;

    color: #8b8b8b;

    font-size: 14px;
    letter-spacing: 0.12em;

    font-weight: 600;
}

.display-toggle {
    width: min(440px, 100%);

    margin: 0 auto 30px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    background: #242424;

    border: 1px solid #474747;

    border-radius: 18px;

    padding: 4px;
}

.display-toggle button {
    height: 52px;

    border: 0;
    border-radius: 14px;

    background: transparent;
    color: #999;

    cursor: pointer;

    font-size: 16px;
}

.display-toggle button.active {
    background: #f1f1f1;
    color: #151515;
}


/* ==================================================
   SCALE INFO
================================================== */

.scale-info {
    text-align: center;
    margin-bottom: 24px;
}

.scale-title {
    font-size:
        clamp(27px, 5vw, 42px);

    font-weight: 750;

    line-height: 1.1;

    margin: 0;
}

.scale-notes {
    margin-top: 14px;

    color: #aaa;

    font-size:
        clamp(16px, 2.5vw, 21px);

    letter-spacing: 0.06em;
}


/* ==================================================
   POSITION NAVIGATION
================================================== */

.position-header {
    display: grid;

    grid-template-columns:
        72px
        minmax(0, 1fr)
        72px;

    align-items: center;

    width: min(760px, 100%);

    margin: 0 auto 18px;

    column-gap: 14px;
}

.position-arrow {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    border: 1px solid #444;

    background: #1d1d1d;
    color: #f2f2f2;

    font-size: 38px;

    line-height: 1;

    cursor: pointer;
}

.position-center {
    min-width: 0;
    text-align: center;
}

.position-title {
    font-size:
        clamp(23px, 4vw, 30px);

    font-weight: 700;

    line-height: 1.15;
}

.position-shape {
    margin-top: 5px;

    color: #aaa;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 0.04em;
}

.fret-range {
    margin-top: 5px;

    color: #777;

    font-size: 14px;
}

.position-dots {
    margin-top: 12px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;
}

.position-dot {
    width: 15px;
    height: 15px;

    flex:
        0 0 15px;

    border-radius: 50%;

    background: #3d3d3d;
}

.position-dot.active {
    background: #f1f1f1;
}


/* ==================================================
   FRETBOARD
================================================== */

.fretboard-wrap {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    padding:
        0 8px;
}

.fretboard {

    --fret-count: 5;
    --label-width: 78px;

    width: 100%;

    display: grid;

    grid-template-columns:
        var(--label-width)
        repeat(
            var(--fret-count),
            minmax(0, 1fr)
        );

    border:
        4px solid #3b3b3b;

    border-radius: 24px;

    overflow: hidden;

    background: #93612d;

    touch-action: pan-y;
}


/* ==================================================
   STRING LABELS
================================================== */

.string-label {
    min-width: 0;
    min-height: 118px;

    background: #303030;

    border-right:
        3px solid #444;

    border-bottom:
        2px solid #b17a3e;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(20px, 3vw, 30px);

    font-weight: 600;
}


/* ==================================================
   FRET CELLS
================================================== */

.fret {
    min-width: 0;
    min-height: 118px;

    position: relative;

    background: #99632e;

    border-right:
        3px solid #bc8242;

    border-bottom:
        2px solid #bc8242;

    display: flex;

    align-items: center;
    justify-content: center;
}

.fret.last-column {
    border-right: 0;
}

.string-label.last-row,
.fret.last-row {
    border-bottom: 0;
}


/* ==================================================
   FRET NUMBER
================================================== */

.fret-number {
    position: absolute;

    right: 7px;
    bottom: 4px;

    color:
        rgba(255,255,255,0.65);

    font-size: 14px;

    pointer-events: none;
}


/* ==================================================
   NOTES
================================================== */

.note {

    width:
        clamp(56px, 7vw, 82px);

    height:
        clamp(56px, 7vw, 82px);

    border-radius: 50%;

    background: #f3f3f3;

    color: #151515;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    line-height: 1;

    font-weight: 700;

    position: relative;

    z-index: 2;
}

.note-name {
    font-size:
        clamp(18px, 2.4vw, 26px);
}

.note-interval {
    margin-top: 7px;

    font-size:
        clamp(13px, 1.7vw, 18px);

    font-weight: 700;
}

.note.root {
    background: #ef334d;
    color: white;
}


/* ==================================================
   LEGEND
================================================== */

.legend {
    margin: 22px auto 0;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 28px;

    color: #999;

    font-size: 16px;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 9px;
}

.legend-dot {
    width: 17px;
    height: 17px;

    border-radius: 50%;
}

.legend-dot.root {
    background: #ef334d;
}

.legend-dot.scale {
    background: #f3f3f3;
}


/* ==================================================
   LANDSCAPE
================================================== */

@media
(orientation: landscape)
and (max-height: 600px) {

    .app {
        padding-top: 14px;
        padding-bottom: 24px;
    }

    .header {
        margin-bottom: 14px;
    }

    .logo {
        font-size: 22px;
    }

    .subtitle {
        display: none;
    }

    .display-label {
        margin-top: 16px;
    }

    .scale-info {
        margin-bottom: 14px;
    }

    .scale-notes {
        margin-top: 8px;
    }

    .position-header {
        margin-bottom: 12px;
    }

    .position-arrow {
        width: 58px;
        height: 58px;
    }

    .position-header {
        grid-template-columns:
            58px
            minmax(0, 1fr)
            58px;
    }

    .fretboard {
        --label-width: 64px;
    }

    .string-label,
    .fret {
        min-height: 86px;
    }

    .note {
        width: 58px;
        height: 58px;
    }

    .note-name {
        font-size: 17px;
    }

    .note-interval {
        font-size: 12px;
        margin-top: 5px;
    }

    .legend {
        margin-top: 14px;
    }
}


/* ==================================================
   SMALL PHONES
================================================== */

@media (max-width: 430px) {

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }

    .controls {
        grid-template-columns:
            92px
            minmax(0, 1fr);
    }

    .root-button,
    .scale-button {
        height: 58px;
    }

    .scale-button {
        padding: 0 16px;
    }

    .root-menu {
        padding: 14px;
        border-radius: 18px;
    }

    .root-grid {
        gap: 6px;
    }

    .root-option {
        min-height: 44px;
        font-size: 15px;
    }

    .position-header {
        grid-template-columns:
            58px
            minmax(0, 1fr)
            58px;

        column-gap: 8px;
    }

    .position-arrow {
        width: 58px;
        height: 58px;

        font-size: 31px;
    }

    .position-dots {
        gap: 9px;
    }

    .position-dot {
        width: 12px;
        height: 12px;

        flex-basis: 12px;
    }

    .fretboard-wrap {
        padding-left: 2px;
        padding-right: 2px;
    }

    .fretboard {
        --label-width: 52px;

        border-width: 3px;
        border-radius: 20px;
    }

    .string-label,
    .fret {
        min-height: 100px;
    }

    .string-label {
        border-right-width: 2px;
    }

    .fret {
        border-right-width: 2px;
    }

    .note {
        width: 56px;
        height: 56px;
    }

    .note-name {
        font-size: 17px;
    }

    .note-interval {
        font-size: 12px;
        margin-top: 5px;
    }

    .fret-number {
        right: 5px;
        font-size: 12px;
    }

    .legend {
        gap: 18px;
        font-size: 14px;
    }

}


@media (max-width: 430px) {
    .works-with-button {
        min-height: 54px;
        padding: 0 16px;
    }

    .works-with-option {
        min-height: 62px;
    }

    .comparison-legend {
        gap: 14px 18px;
        font-size: 13px;
    }
}

</style>
</head>


<body>

<div class="app">


<header class="header">

    <div class="logo">
        ProjectVoul
    </div>

    <div class="subtitle">
        Guitar · Scales · Notes
    </div>

</header>


<!-- ==================================================
     CONTROLS
================================================== -->

<div class="controls">

    <button
        class="root-button"
        id="rootButton">

        C

    </button>


    <button
        class="scale-button"
        id="scaleButton">

        <span id="selectedScale">
            Major / Ionian
        </span>

        <span class="arrow">
            ▾
        </span>

    </button>

</div>


<!-- ==================================================
     ROOT MENU
================================================== -->

<div
    class="root-menu"
    id="rootMenu">

    <div class="root-menu-title">
        ROOT NOTE
    </div>

    <div class="root-grid">

        <button class="root-option" data-root="C">C</button>
        <button class="root-option" data-root="C#">C#</button>
        <button class="root-option" data-root="Db">Db</button>
        <button class="root-option" data-root="D">D</button>

        <button class="root-option" data-root="D#">D#</button>
        <button class="root-option" data-root="Eb">Eb</button>
        <button class="root-option" data-root="E">E</button>
        <button class="root-option" data-root="F">F</button>

        <button class="root-option" data-root="F#">F#</button>
        <button class="root-option" data-root="Gb">Gb</button>
        <button class="root-option" data-root="G">G</button>
        <button class="root-option" data-root="G#">G#</button>

        <button class="root-option" data-root="Ab">Ab</button>
        <button class="root-option" data-root="A">A</button>
        <button class="root-option" data-root="A#">A#</button>
        <button class="root-option" data-root="Bb">Bb</button>

        <button class="root-option" data-root="B">B</button>

    </div>

</div>


<!-- ==================================================
     SCALE MENU
================================================== -->

<div
    class="scale-menu"
    id="scaleMenu">


    <section class="category open">

        <button class="category-header">

            <span>
                DIATONIC
            </span>

            <span class="chevron">
                ›
            </span>

        </button>


        <div class="scale-list">

            <button
                class="scale-option active"
                data-scale="major">

                Major / Ionian

            </button>


            <button
                class="scale-option"
                data-scale="dorian">

                Dorian

            </button>


            <button
                class="scale-option"
                data-scale="phrygian">

                Phrygian

            </button>


            <button
                class="scale-option"
                data-scale="lydian">

                Lydian

            </button>


            <button
                class="scale-option"
                data-scale="mixolydian">

                Mixolydian

            </button>


            <button
                class="scale-option"
                data-scale="naturalMinor">

                Natural Minor / Aeolian

            </button>


            <button
                class="scale-option"
                data-scale="locrian">

                Locrian

            </button>

        </div>

    </section>


    <section class="category">

        <button class="category-header">

            <span>
                MINOR
            </span>

            <span class="chevron">
                ›
            </span>

        </button>


        <div class="scale-list">

            <button
                class="scale-option"
                data-scale="naturalMinor">

                Natural Minor / Aeolian

            </button>


            <button
                class="scale-option"
                data-scale="harmonicMinor">

                Harmonic Minor

            </button>


            <button
                class="scale-option"
                data-scale="melodicMinor">

                Melodic Minor

            </button>

        </div>

    </section>


    <section class="category">

        <button class="category-header">

            <span>
                PENTATONIC &amp; BLUES
            </span>

            <span class="chevron">
                ›
            </span>

        </button>


        <div class="scale-list">

            <button
                class="scale-option"
                data-scale="majorPentatonic">

                Major Pentatonic

            </button>


            <button
                class="scale-option"
                data-scale="minorPentatonic">

                Minor Pentatonic

            </button>


            <button
                class="scale-option"
                data-scale="blues">

                Blues

            </button>

        </div>

    </section>


    <section class="category">

        <button class="category-header">

            <span>
                JAZZ
            </span>

            <span class="chevron">
                ›
            </span>

        </button>


        <div class="scale-list">

            <button
                class="scale-option"
                data-scale="lydianDominant">

                Lydian Dominant

            </button>


            <button
                class="scale-option"
                data-scale="altered">

                Altered

            </button>


            <button

    return ((pitch % 12) + 12) % 12;

function transposeRoot(root, semitones) {
    return chromatic[normalizePitch(noteIndex(root) + semitones)];
}

                label: relation.label

                root: transposeRoot(currentRoot, -relation.offset),
                label: relation.label
            });
        }
    });

    return options;

function mod12(value) {

    return (
        (value % 12) + 12
    ) % 12;

}


function noteIndex(note) {

    return rootData[note]
        ? rootData[note].pitch
        : -1;

}

    const letters = [
        "C",
        "D",
        "E",
        "F",
        "G",
        "A",
        "B"
    ];

    return letters.indexOf(letter);

}


function accidentalText(value) {

    if (value > 0) {
        return "#".repeat(value);
    }

    if (value < 0) {
        return "b".repeat(Math.abs(value));
    }

    return "";

}

   lookup. That would turn, for example:

       C# major

   into a mixture of sharps and flats.

   Instead, the scale degree determines the
   natural letter and the scale definition
   determines the accidental.
*/

function getScaleNotes() {

    const root =
        rootData[currentRoot];

    const scale =
        scaleData[currentScale];

    const letters = [
        "C",
        "D",
        "E",
        "F",
        "G",
        "A",
        "B"
    ];

    const rootLetterIndex =
        getNaturalLetterIndex(
            root.letter
        );

    return scale.intervals.map(
        (interval, index) => {

            const degreeOffset =
                scale.degreeOffsets[index];

            const letter =
                letters[
                    (
                        rootLetterIndex
                        + degreeOffset
                    ) % 7
                ];

            const naturalPitch =
                naturalPitchValue(letter);

            const targetPitch =
                mod12(
                    root.pitch + interval
                );

            /*
               The scale degree determines the natural letter.
               The selected root and interval determine the
               accidental required for that letter.

               Example:

               C# major =
               C# D# E# F# G# A# B#

               This avoids the previous problem where the
               accidental table was effectively fixed to C.
            */

            let accidental =
                targetPitch -
                naturalPitch;

            while (accidental > 6) {
                accidental -= 12;
            }

            while (accidental < -6) {
                accidental += 12;
            }

            return {

                pitch:
                    targetPitch,

                interval,

                name:
                    letter +
                    accidentalText(
                        accidental
                    )

            };

        }
    );

}

   COMPARISON MODE
================================================== */

function getScaleNoteMap(scaleKey, root) {

    const rootDataEntry = rootData[root];
    const scale = scaleData[scaleKey];
    const map = new Map();

    scale.intervals.forEach((interval, degreeIndex) => {

        const pitch = mod12(rootDataEntry.pitch + interval);
        const degreeOffset = scale.degreeOffsets[degreeIndex];
        const letters = ["C", "D", "E", "F", "G", "A", "B"];
        const rootLetterIndex = getNaturalLetterIndex(rootDataEntry.letter);
        const letter = letters[(rootLetterIndex + degreeOffset) % 7];
        const natural = naturalPitchValue(letter);

        let accidental = pitch - natural;
        while (accidental > 6) accidental -= 12;
        while (accidental < -6) accidental += 12;

        map.set(pitch, {
            pitch,
            interval,
            name: letter + accidentalText(accidental)
        });
    });

    return map;
}


function getComparisonScaleNames() {

    const map = getScaleNoteMap(comparisonScale, comparisonRoot);
    return [...map.values()].map(note => note.name);

}


function renderComparisonFretboard() {

    const board = document.getElementById("fretboard");
    board.innerHTML = "";

    const mapA = getScaleNoteMap(currentScale, currentRoot);
    const mapB = getScaleNoteMap(comparisonScale, comparisonRoot);
    const position = positionDatabase[currentPosition];

    if (!position) return;

    const startFret = position.startFret;
    const endFret = position.endFret;
    const fretCount = endFret - startFret + 1;

    board.style.setProperty("--fret-count", fretCount);

    const displayStrings = stringsReversed ? [...strings].reverse() : strings;

    displayStrings.forEach((string, displayIndex) => {

        const isLastRow = displayIndex === displayStrings.length - 1;
        const label = document.createElement("div");
        label.className = "string-label";
        if (isLastRow) label.classList.add("last-row");
        label.textContent = string.name;
        board.appendChild(label);

        for (let fret = startFret; fret <= endFret; fret++) {

            const cell = document.createElement("div");
            cell.className = "fret";
            if (fret === endFret) cell.classList.add("last-column");
            if (isLastRow) cell.classList.add("last-row");

            const pitch = mod12(string.pitch + fret);
            const noteA = mapA.get(pitch);
            const noteB = mapB.get(pitch);

            if (noteA || noteB) {

                const note = document.createElement("div");
                note.className = "note";

                const shared = !!noteA && !!noteB;
                const rootA = noteA && noteA.interval === 0;
                const rootB = noteB && noteB.interval === 0;

                if (shared && rootA && rootB) {
                    note.classList.add("comparison-shared-root");
                } else if (rootA) {
                    note.classList.add("comparison-root-a");
                } else if (rootB) {
                    note.classList.add("comparison-root-b");
                } else if (shared) {
                    note.classList.add("comparison-shared");
                } else if (noteA) {
                    note.classList.add("comparison-a");
                } else {
                    note.classList.add("comparison-b");
                }

                const primary = noteA || noteB;
                const name = document.createElement("div");
                name.className = "note-name";
                name.textContent = primary.name;

                const intervalLabel = document.createElement("div");
                intervalLabel.className = "note-interval";

                if (shared) {
                    intervalLabel.textContent =
                        `${noteA.interval === 0 ? "R" : getIntervalLabel(noteA.interval)} / ${noteB.interval === 0 ? "R" : getIntervalLabel(noteB.interval)}`;
                } else {
                    intervalLabel.textContent =
                        primary.interval === 0 ? "R" : getIntervalLabel(primary.interval);
                }

                if (displayMode === "notes") intervalLabel.style.display = "none";
                if (displayMode === "intervals") name.style.display = "none";

                note.appendChild(name);
                note.appendChild(intervalLabel);
                cell.appendChild(note);
            }

            const fretNumber = document.createElement("span");
            fretNumber.className = "fret-number";
            fretNumber.textContent = fret;
            cell.appendChild(fretNumber);
            board.appendChild(cell);
        }
    });
}


function renderFretboard() {

    if (comparisonMode) {
        renderComparisonFretboard();
    } else {
        renderSingleFretboard();
    }

}


function enterComparison(scale, root) {

    comparisonScale = scale;
    comparisonRoot = root;
    comparisonMode = true;
    currentPosition = 0;

    document.getElementById("comparisonInfo").classList.add("open");
    document.getElementById("comparisonBack").classList.add("open");
    document.getElementById("singleScaleLegend").style.display = "none";

    document.getElementById("comparisonTitle").textContent =
        `${currentRoot} ${scaleData[currentScale].name} + ${comparisonRoot} ${scaleData[comparisonScale].name}`;

    document.getElementById("comparisonSubtitle").textContent =
        `${getScaleNotes().map(note => note.name).join(" · ")}  +  ${getComparisonScaleNames().join(" · ")}`;

    document.getElementById("worksWithMenu").classList.remove("open");
    document.getElementById("worksWithButton").classList.remove("open");

    updateAll();
}


function exitComparison() {

    comparisonMode = false;
    comparisonScale = null;
    comparisonRoot = null;

    document.getElementById("comparisonInfo").classList.remove("open");
    document.getElementById("comparisonBack").classList.remove("open");
    document.getElementById("singleScaleLegend").style.display = "flex";

    updateAll();
}


function renderWorksWellWithOptions() {

    const container = document.getElementById("worksWithOptions");
    container.innerHTML = "";

    const options = getWorksWellWithOptions();

    if (options.length === 0) {
        const empty = document.createElement("div");
        empty.className = "works-with-title";
        empty.textContent = "No curated pairing for this scale yet.";
        container.appendChild(empty);
        return;
    }

    options.forEach(option => {

        const button = document.createElement("button");
        button.type = "button";
        button.className = "works-with-option";

        const name = document.createElement("span");
        name.className = "works-with-option-name";
        name.textContent = `${option.root} ${scaleData[option.scale].name}`;

        const relation = document.createElement("span");
        relation.className = "works-with-option-relation";
        relation.textContent = option.label;

        button.appendChild(name);
        button.appendChild(relation);

        button.addEventListener("click", () => enterComparison(option.scale, option.root));
        container.appendChild(button);
    });
}


/* ==================================================
   INTERVAL LABELS
================================================== */

function getIntervalLabel(
    semitones
) {

    const labels = {

        0: "R",

        1: "m2",
        2: "M2",

        3: "m3",
        4: "M3",

        5: "P4",

        6: "TT",

        7: "P5",

        8: "m6",
        9: "M6",

        10: "m7",
        11: "M7"

    };

    return labels[
        mod12(semitones)
    ];

}


/* ==================================================
   POSITION DATABASE
================================================== */


/*
   The important architectural change:

   Position data is now an actual object.

   The renderer never decides:

       currentPosition * 5 + 1

   anymore.

   It asks the database for the selected
   pattern and renders that pattern.
*/

function buildPositionDatabase() {

    const scale =
        scaleData[currentScale];

    const rootPitch =
        noteIndex(currentRoot);


    if (
        scale.system === "Symmetric"
    ) {

        return SYMMETRIC_TEMPLATES
            .map(template => {

                let start =
                    rootPitch +
                    template.startOffset;

                let end =
                    rootPitch +
                    template.endOffset;

                /*
                   Keep the displayed region inside
                   the normal guitar range.

                   Each symmetric pattern remains a
                   practical six-fret study region.
                */

                while (start < 1) {

                    start += 12;
                    end += 12;

                }

                while (start > 19) {

                    start -= 12;
                    end -= 12;

                }

                return {

                    shape:
                        template.shape,

                    startFret:
                        start,

                    endFret:
                        end,

                    system:
                        scale.system

                };

            })
            .sort(
                (a, b) =>
                    a.startFret -
                    b.startFret
            );

    }


    /*
       For CAGED-derived scales, transpose the
       verified C-major reference geometry by
       the distance from C to the selected root.
    */

    const transposition =
        rootPitch;


    return CAGED_TEMPLATES.map(
        template => {

            let start =
                template.start +
                transposition;

            let end =
                template.end +
                transposition;


            /*
               Fold the template back into the
               useful 1–24 fret range.
            */

            while (start > 19) {

                start -= 12;
                end -= 12;

            }

            while (end < 1) {

                start += 12;
                end += 12;

            }


            return {

                shape:
                    template.shape,

                startFret:
                    start,

                endFret:
                    end,

                system:
                    scale.system

            };

        }
    );

}


/*
   This is the actual Position Database.

   It is rebuilt whenever root or scale changes.
*/

let positionDatabase = [];


/* ==================================================
   POSITION UI
================================================== */

function updatePositionUI() {

    positionDatabase =
        buildPositionDatabase();

    const position =
        positionDatabase[
            currentPosition
        ];

    const positionTitle =
        document.getElementById(
            "positionTitle"
        );

    const positionShape =
        document.getElementById(
            "positionShape"
        );

    const fretRange =
        document.getElementById(
            "fretRange"
        );


    positionTitle.textContent =
        `Position ${
            currentPosition + 1
        } / ${
            positionDatabase.length
        }`;


    positionShape.textContent =
        position.system === "Symmetric"
            ? position.shape
            : `${position.shape} Shape · CAGED`;


    fretRange.textContent =
        `Frets ${
            position.startFret
        } – ${
            position.endFret
        }`;


    renderPositionDots();

}


function renderPositionDots() {

    const container =
        document.getElementById(
            "positionDots"
        );

    container.innerHTML = "";


    for (
        let i = 0;
        i < positionDatabase.length;
        i++
    ) {

        const dot =
            document.createElement(
                "span"
            );

        dot.className =
            "position-dot";


        if (
            i === currentPosition
        ) {

            dot.classList.add(
                "active"
            );

        }


        container.appendChild(
            dot
        );

    }

}


/* ==================================================
   SCALE INFORMATION
================================================== */

function updateScaleInfo() {

    const scale =
        scaleData[currentScale];

    document.getElementById(
        "scaleTitle"
    ).textContent =
        `${currentRoot} ${scale.name}`;


    const notes =
        getScaleNotes();


    document.getElementById(
        "scaleNotes"
    ).textContent =
        notes
            .map(note => note.name)
            .join(" · ");


    document.getElementById(
        "selectedScale"
    ).textContent =
        scale.name;

}


/* ==================================================
   FRETBOARD
================================================== */

function renderSingleFretboard() {

    const board =
        document.getElementById(
            "fretboard"
        );

    board.innerHTML = "";


    const scaleNotes =
        getScaleNotes();


    /*
       Map pitch → scale information.

       The interval is kept in semitones from
       the tonic, so display modes continue to
       work exactly as before.
    */

    const scaleMap =
        new Map();


    scaleNotes.forEach(
        note => {

            scaleMap.set(
                note.pitch,
                note.interval
            );

        }
    );


    const position =
        positionDatabase[
            currentPosition
        ];


    if (!position) {
        return;
    }


    const startFret =
        position.startFret;

    const endFret =
        position.endFret;


    const fretCount =
        endFret -
        startFret +
        1;


    board.style.setProperty(
        "--fret-count",
        fretCount
    );


    strings.forEach(
        (string, stringIndex) => {


            const isLastRow =
                stringIndex ===
                strings.length - 1;


            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "string-label";


            if (isLastRow) {

                label.classList.add(
                    "last-row"
                );

            }


            label.textContent =
                string.name;


            board.appendChild(
                label
            );


            for (
                let fret = startFret;
                fret <= endFret;
                fret++
            ) {


                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "fret";


                if (
                    fret === endFret
                ) {

                    cell.classList.add(
                        "last-column"
                    );

                }


                if (isLastRow) {

                    cell.classList.add(
                        "last-row"
                    );

                }


                const pitch =
                    mod12(
                        string.pitch +
                        fret
                    );


                if (
                    scaleMap.has(
                        pitch
                    )
                ) {


                    const interval =
                        scaleMap.get(
                            pitch
                        );


                    const scaleNote =
                        scaleNotes.find(
                            note =>
                                note.pitch ===
                                pitch
                        );


                    const note =
                        document.createElement(
                            "div"
                        );


                    note.className =
                        "note";


                    if (
                        interval === 0
                    ) {

                        note.classList.add(
                            "root"
                        );

                    }


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "note-name";


                    name.textContent =
                        scaleNote.name;


                    const intervalLabel =
                        document.createElement(
                            "div"
                        );


                    intervalLabel.className =
                        "note-interval";


                    intervalLabel.textContent =
                        interval === 0
                            ? "R"
                            : getIntervalLabel(
                                interval
                            );


                    if (
                        displayMode ===
                        "notes"
                    ) {

                        intervalLabel.style.display =
                            "none";

                    }


                    if (
                        displayMode ===
                        "intervals"
                    ) {

                        name.style.display =
                            "none";

                    }


                    note.appendChild(
                        name
                    );

                    note.appendChild(
                        intervalLabel
                    );


                    cell.appendChild(
                        note
                    );

                }


                const fretNumber =
                    document.createElement(
                        "span"
                    );


                fretNumber.className =
                    "fret-number";


                fretNumber.textContent =
                    fret;


                cell.appendChild(
                    fretNumber
                );


                board.appendChild(
                    cell
                );

            }

        }
    );

}


/* ==================================================
   FULL UPDATE
================================================== */

function updateAll() {

    updateScaleInfo();

    positionDatabase =
        buildPositionDatabase();


    /*
       Make sure the selected position still
       exists after changing scale.
    */

    if (
        currentPosition >=
        positionDatabase.length
    ) {

        currentPosition = 0;

    }


    updatePositionUI();

    renderFretboard();

}


/* ==================================================
   SCALE MENU
================================================== */

const scaleButton =
    document.getElementById(
        "scaleButton"
    );


const scaleMenu =
    document.getElementById(
        "scaleMenu"
    );


scaleButton.addEventListener(
    "click",
    () => {

        scaleMenu.classList.toggle(
            "open"
        );

        rootMenu.classList.remove(
            "open"
        );

    }
);


document
    .querySelectorAll(
        ".category-header"
    )
    .forEach(
        header => {

            header.addEventListener(
                "click",
                () => {

                    const category =
                        header.parentElement;

                    category.classList.toggle(
                        "open"
                    );

                }
            );

        }
    );


document
    .querySelectorAll(
        ".scale-option"
    )
    .forEach(
        option => {

            option.addEventListener(
                "click",
                () => {

                    currentScale =
                        option.dataset.scale;

                    if (comparisonMode) {
                        exitComparison();
                    }


                    document
                        .querySelectorAll(
                            ".scale-option"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    option.classList.add(
                        "active"
                    );


                    scaleMenu.classList.remove(
                        "open"
                    );


                    currentPosition =
                        0;


                    updateAll();

                }
            );

        }
    );


/* ==================================================
   POSITION NAVIGATION
================================================== */

function nextPosition() {

    positionDatabase =
        buildPositionDatabase();


    currentPosition++;


    if (
        currentPosition >=
        positionDatabase.length
    ) {

        currentPosition = 0;

    }


    updateAll();

}


function previousPosition() {

    positionDatabase =
        buildPositionDatabase();


    currentPosition--;


    if (
        currentPosition < 0
    ) {

        currentPosition =
            positionDatabase.length - 1;

    }


    updateAll();

}


document
    .getElementById(
        "previousPosition"
    )
    .addEventListener(
        "click",
        previousPosition
    );


document
    .getElementById(
        "nextPosition"
    )
    .addEventListener(
        "click",
        nextPosition
    );


/* ==================================================
   SWIPE
================================================== */

const fretboardElement =
    document.getElementById(
        "fretboard"
    );


let touchStartX = 0;

let touchStartY = 0;


const SWIPE_THRESHOLD = 50;


fretboardElement.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


fretboardElement.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        /*
           Ignore primarily vertical gestures.
        */

        if (
            Math.abs(deltaY) >
            Math.abs(deltaX)
        ) {

            return;

        }


        if (
            Math.abs(deltaX) <
            SWIPE_THRESHOLD
        ) {

            return;

        }


        if (
            deltaX < 0
        ) {

            nextPosition();

        } else {

            previousPosition();

        }

    }
);


/* ==================================================
   STRING ORDER
================================================== */

document
    .querySelectorAll(".string-order-toggle button")
    .forEach(button => {

        button.addEventListener("click", () => {

            stringsReversed =
                button.dataset.stringOrder === "tab";

            document
                .querySelectorAll(".string-order-toggle button")
                .forEach(item => item.classList.remove("active"));

            button.classList.add("active");
            renderFretboard();
        });
    });


/* ==================================================
   DISPLAY MODE
================================================== */

document
    .querySelectorAll(
        ".display-toggle button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    displayMode =
                        button.dataset.display;


                    document
                        .querySelectorAll(
                            ".display-toggle button"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    renderFretboard();

                }
            );

        }
    );


/* ==================================================
   ROOT SELECTOR
================================================== */

const rootButton =
    document.getElementById(
        "rootButton"
    );


const rootMenu =
    document.getElementById(
        "rootMenu"
    );


const rootOptions =
    document.querySelectorAll(
        ".root-option"
    );


function updateRootMenu() {

    rootOptions.forEach(
        option => {

            option.classList.toggle(
                "active",
                option.dataset.root ===
                    currentRoot
            );

        }
    );

}


rootButton.addEventListener(
    "click",
    () => {

        rootMenu.classList.toggle(
            "open"
        );

        scaleMenu.classList.remove(
            "open"
        );

        updateRootMenu();

    }
);


rootOptions.forEach(
    option => {

        option.addEventListener(
            "click",
            () => {

                currentRoot =
                    option.dataset.root;

                if (comparisonMode) {
                    exitComparison();
                }

                currentPosition = 0;

                rootButton.textContent =
                    currentRoot;

                rootMenu.classList.remove(
                    "open"
                );

                updateAll();

            }
        );

    }
);


/*
   Clicking outside either menu closes it.
*/

document.addEventListener(
    "click",
    event => {

        if (
            !rootMenu.contains(event.target) &&
            event.target !== rootButton
        ) {

            rootMenu.classList.remove(
                "open"
            );

        }

        if (
            !scaleMenu.contains(event.target) &&
            event.target !== scaleButton
        ) {

            scaleMenu.classList.remove(
                "open"
            );

        }

    }
);


/* ==================================================
   WORKS WELL WITH EVENTS
================================================== */

const worksWithButton = document.getElementById("worksWithButton");
const worksWithMenu = document.getElementById("worksWithMenu");

worksWithButton.addEventListener("click", event => {
    event.stopPropagation();

    worksWithMenu.classList.toggle("open");
    worksWithButton.classList.toggle("open");

    rootMenu.classList.remove("open");
    scaleMenu.classList.remove("open");

    renderWorksWellWithOptions();
});

document.getElementById("comparisonBack").addEventListener("click", exitComparison);

document.addEventListener("click", event => {
    if (!worksWithMenu.contains(event.target) && !worksWithButton.contains(event.target)) {
        worksWithMenu.classList.remove("open");
        worksWithButton.classList.remove("open");
    }
});


/* ==================================================
   INITIAL RENDER
================================================== */

updateAll();

</script>
